<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Architectural Balance Sandbox</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0f19;
            --panel-bg: #161b26;
            --accent-green: #39ff14;
            --accent-pink: #ff6ec7;
            --accent-cyan: #00f0ff;
            --accent-purple: #bd93f9;
            --accent-yellow: #ffff33;
            --accent-orange: #ff9933;
            --text-color: #f0f3f8;
            --text-muted: #a0aec0;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Quicksand', 'Segoe UI', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
        }

        .container {
            display: flex;
            flex-direction: row;
            background: var(--panel-bg);
            border-radius: 24px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.6);
            border: 2px solid #2d3748;
            width: 1100px;
            max-width: 95vw;
            height: 680px;
            overflow: hidden;
        }

        .canvas-area {
            position: relative;
            flex: 1;
            background: #0d1117;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Responsive styling for the canvas itself */
        canvas {
            display: block;
            width: 100%;
            height: 100%;
            cursor: grab;
        }
        canvas:active {
            cursor: grabbing;
        }

        .sidebar {
            width: 400px;
            background: var(--panel-bg);
            border-left: 2px solid #2d3748;
            padding: 24px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-sizing: border-box;
            overflow-y: auto;
        }

        .header-title {
            font-family: 'Fredoka', sans-serif;
            font-size: 1.4rem;
            line-height: 1.3;
            color: var(--text-color);
            margin: 0 0 16px 0;
            border-bottom: 2px dashed #2d3748;
            padding-bottom: 16px;
        }

        .balance-modes {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .mode-btn {
            flex: 1;
            padding: 12px 8px;
            border-radius: 14px;
            border: 2px solid transparent;
            background: #2d3748;
            color: #fff;
            font-family: 'Fredoka', sans-serif;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            text-align: center;
        }

        .mode-btn:hover {
            transform: translateY(-2px);
            background: #3a475c;
        }

        .mode-btn.active {
            background: var(--accent-purple);
            border-color: #fff;
            box-shadow: 0 0 15px rgba(189, 147, 249, 0.6);
            transform: scale(1.05);
        }

        .options-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 15px;
        }

        .option-card {
            background: #1f293d;
            border: 2px solid #2d3748;
            border-radius: 16px;
            padding: 14px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 0.95rem;
            font-weight: 700;
            line-height: 1.4;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .option-card:hover {
            border-color: var(--accent-cyan);
            background: #24334f;
            transform: translateX(6px);
        }

        .option-card.selected {
            border-color: var(--accent-green);
            background: #1a3a3a;
            box-shadow: 0 0 15px rgba(57, 255, 20, 0.2);
        }

        .option-badge {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            width: 28px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Fredoka', sans-serif;
            font-size: 0.9rem;
            flex-shrink: 0;
        }

        .option-card.selected .option-badge {
            background: var(--accent-green);
            color: #000;
        }

        .controls-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
            background: #1f293d;
            padding: 10px 16px;
            border-radius: 16px;
            border: 1px solid #2d3748;
        }

        .voice-btn {
            background: var(--accent-pink);
            color: #000;
            border: none;
            padding: 10px 16px;
            border-radius: 12px;
            cursor: pointer;
            font-family: 'Fredoka', sans-serif;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9rem;
            transition: all 0.15s ease;
        }

        .voice-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 12px rgba(255, 110, 199, 0.5);
        }

        .speech-indicator {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #2d3748;
            display: inline-block;
            transition: background-color 0.3s ease;
        }

        .speech-indicator.active {
            background: var(--accent-green);
            box-shadow: 0 0 12px var(--accent-green);
            animation: pulse 1s infinite alternate;
        }

        @keyframes pulse {
            0% { transform: scale(0.9); opacity: 0.6; }
            100% { transform: scale(1.2); opacity: 1; }
        }

        .section-label {
            font-family: 'Fredoka', sans-serif;
            font-size: 0.85rem;
            margin-bottom: 8px;
            color: var(--text-muted);
            letter-spacing: 0.5px;
        }

        /* Simple overlay on canvas to guide kids */
        .instruction-overlay {
            position: absolute;
            bottom: 16px;
            left: 16px;
            background: rgba(11, 15, 25, 0.85);
            padding: 8px 16px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            font-size: 0.85rem;
            pointer-events: none;
            color: var(--text-color);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .heartbeat-dot {
            width: 8px;
            height: 8px;
            background: var(--accent-cyan);
            border-radius: 50%;
            animation: pulse 0.8s infinite alternate;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Interactive Play Area -->
        <div class="canvas-area">
            <canvas id="balanceCanvas"></canvas>
            <div class="instruction-overlay">
                <span class="heartbeat-dot"></span>
                <span>Drag the items to balance or sweep mouse/finger to make wind!</span>
            </div>
        </div>

        <!-- Right Side Control Desk -->
        <div class="sidebar">
            <div>
                <h2 class="header-title">What are three primary types of balance about an axis of reference in design?</h2>
                
                <div class="controls-row">
                    <button class="voice-btn" onclick="speakQuestion()">🔊 Let's Read!</button>
                    <div style="display: flex; align-items: center; gap: 8px;">
                        <span style="font-size: 0.8rem; color: var(--text-muted);">Storyteller Speaking:</span>
                        <div id="speechIndicator" class="speech-indicator"></div>
                    </div>
                </div>

                <div class="section-label">CHOOSE A BALANCE TOY MODE:</div>
                <div class="balance-modes">
                    <button id="btnSym" class="mode-btn active" onclick="setMode('symmetrical')">Perfect Twins</button>
                    <button id="btnNear" class="mode-btn" onclick="setMode('nearly')">Silly Twins</button>
                    <button id="btnAsym" class="mode-btn" onclick="setMode('asymmetrical')">Hippo & Bunny</button>
                </div>
            </div>

            <div>
                <div class="section-label">TAP YOUR COMPOSITION ANSWER:</div>
                <div class="options-list" id="optionsContainer">
                    <!-- Options injected dynamically -->
                </div>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('balanceCanvas');
        const ctx = canvas.getContext('2d');
        
        let width = 0;
        let height = 0;
        const logicalWidth = 800;
        const logicalHeight = 650;

        function resize() {
            const rect = canvas.getBoundingClientRect();
            canvas.width = rect.width * window.devicePixelRatio;
            canvas.height = rect.height * window.devicePixelRatio;
            width = rect.width;
            height = rect.height;
        }
        window.addEventListener('resize', resize);
        resize();

        // Architectural Balance Mode State
        let balanceMode = 'symmetrical'; // 'symmetrical' | 'nearly' | 'asymmetrical'
        
        // Physics constants and state values
        let beamAngle = 0;
        let angularVelocity = 0;
        const beamY = 420;
        const pivotX = 400; // local coordinates center

        // Interactive Object Offsets (Distance from dynamic center beanstalk)
        // Values represent distance in pixels from center
        let leftObject = { d: 180, targetD: 180, mass: 200, label: "Twin A", isDragging: false };
        let rightObject = { d: 180, targetD: 180, mass: 200, label: "Twin B", isDragging: false };

        // Wind / Sweep gesture tracking
        let windForce = 0;
        let targetWindForce = 0;
        let prevMouseX = null;
        let isSweepingBackground = false;

        // Custom Sound Synthesizer via Web Audio API
        let audioCtx = null;
        let carrierOsc = null;
        let wobbleOsc = null;
        let wobbleGain = null;
        let mainGain = null;

        function initAudio() {
            if (audioCtx) return;
            try {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                
                carrierOsc = audioCtx.createOscillator();
                wobbleOsc = audioCtx.createOscillator();
                wobbleGain = audioCtx.createGain();
                mainGain = audioCtx.createGain();
                
                carrierOsc.type = 'triangle';
                wobbleOsc.type = 'sine';
                
                // Connect wobble (vibrato frequency modulator)
                wobbleOsc.frequency.value = 5; 
                wobbleGain.gain.value = 0; // standard deviation
                
                wobbleOsc.connect(wobbleGain);
                wobbleGain.connect(carrierOsc.frequency);
                
                carrierOsc.connect(mainGain);
                mainGain.connect(audioCtx.destination);
                
                carrierOsc.frequency.value = 261.63; // Base scale C4
                mainGain.gain.value = 0; // keep silent initially
                
                carrierOsc.start();
                wobbleOsc.start();
            } catch (e) {
                console.warn("Web Audio API not fully supported on this platform.", e);
            }
        }

        function updateAudioSynth(angle, active) {
            if (!audioCtx) return;
            
            // Bring audio volume up during active interactions or balance tilts
            const absoluteTilt = Math.abs(angle);
            const targetVolume = active ? 0.22 : Math.max(0, (absoluteTilt - 0.02) * 0.4);
            
            mainGain.gain.setTargetAtTime(targetVolume, audioCtx.currentTime, 0.1);
            
            // Frequency scales up with structural imbalance tilt
            const targetFreq = 261.63 + (absoluteTilt * 800);
            carrierOsc.frequency.setTargetAtTime(targetFreq, audioCtx.currentTime, 0.1);
            
            // Increase modulation speed under higher imbalances
            const targetWobbleSpeed = absoluteTilt * 30;
            wobbleOsc.frequency.setTargetAtTime(targetWobbleSpeed, audioCtx.currentTime, 0.1);
            wobbleGain.gain.setTargetAtTime(absoluteTilt * 50, audioCtx.currentTime, 0.15);
        }

        // Native Speech Synthesizer Script Narrations
        const speechIndicator = document.getElementById('speechIndicator');
        let currentUtterance = null;

        function clearSpeech() {
            if (window.speechSynthesis) {
                window.speechSynthesis.cancel();
            }
            speechIndicator.classList.remove('active');
        }

        function speakText(text) {
            if (!window.speechSynthesis) return;
            clearSpeech();
            
            currentUtterance = new SpeechSynthesisUtterance(text);
            currentUtterance.onstart = () => {
                speechIndicator.classList.add('active');
            };
            currentUtterance.onend = () => {
                speechIndicator.classList.remove('active');
            };
            currentUtterance.onerror = () => {
                speechIndicator.classList.remove('active');
            };
            window.speechSynthesis.speak(currentUtterance);
        }

        function speakQuestion() {
            const questionStr = "What are three primary types of balance about an axis of reference described in architectural composition? " +
                "Option A: Geometric, Organic, and Fractional Balance. " +
                "Option B: Symmetrical, Nearly Symmetrical, and Asymmetrical Balance. " +
                "Option C: Horizontal, Vertical, and Diagonal Balance. " +
                "Option D: Volumetric, Color-based, and Material-based Balance.";
            speakText(questionStr);
        }

        function speakScenarioDescription() {
            let descText = "";
            if (balanceMode === 'symmetrical') {
                descText = "Look! Two identical cupcake twins sitting at the exact same distance from our bright green beanstalk axis. They are perfectly symmetrical!";
            } else if (balanceMode === 'nearly') {
                descText = "These twins are almost identical, but one is wearing a massive, funny party hat! To keep the beam flat, the yellow hat twin must wiggle just a little bit closer to the beanstalk.";
            } else if (balanceMode === 'asymmetrical') {
                descText = "Wow! A giant, heavy blue hippo is balanced beautifully by a tiny bunny! The hippo stays close to the middle axis, while the bunny hops way out to the far end. This is asymmetrical balance!";
            }
            speakText(descText);
        }

        // Initialize state defaults for balance modes
        function setMode(mode) {
            balanceMode = mode;
            document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
            
            if (mode === 'symmetrical') {
                document.getElementById('btnSym').classList.add('active');
                leftObject.mass = 200;
                leftObject.targetD = 180;
                leftObject.label = "Cupcake Twin A";
                
                rightObject.mass = 200;
                rightObject.targetD = 180;
                rightObject.label = "Cupcake Twin B";
            } else if (mode === 'nearly') {
                document.getElementById('btnNear').classList.add('active');
                leftObject.mass = 200;
                leftObject.targetD = 180;
                leftObject.label = "Plain Twin";
                
                // Neon party hat introduces offset imbalance requiring user corrective compensation
                rightObject.mass = 260; 
                rightObject.targetD = 138; // Pre-balanced near perfect
                rightObject.label = "Party Hat Twin";
            } else if (mode === 'asymmetrical') {
                document.getElementById('btnAsym').classList.add('active');
                leftObject.mass = 500; // Heavy blue Hippo
                leftObject.targetD = 60; // Needs to sit very close to vertical axis
                leftObject.label = "Chunky Hippo";
                
                rightObject.mass = 120; // Lightweight orange Bunny
                rightObject.targetD = 250; // Needs to sit far out to balance
                rightObject.label = "Fluffy Bunny";
            }
            
            // Auto align visual states immediately for immediate tactile switch response
            leftObject.d = leftObject.targetD;
            rightObject.d = rightObject.targetD;
            
            initAudio();
            speakScenarioDescription();
        }

        // Native MCQ Options Setup
        let currentOptions = [
            { text: "Geometric, Organic, and Fractional Balance", originalIndex: 0 },
            { text: "Symmetrical, Nearly Symmetrical, and Asymmetrical Balance", originalIndex: 1 },
            { text: "Horizontal, Vertical, and Diagonal Balance", originalIndex: 2 },
            { text: "Volumetric, Color-based, and Material-based Balance", originalIndex: 3 }
        ];
        let selectedIndex = null;

        function renderOptionButtons() {
            const container = document.getElementById('optionsContainer');
            container.innerHTML = '';
            
            const letters = ['A', 'B', 'C', 'D'];
            currentOptions.forEach((opt, idx) => {
                const card = document.createElement('div');
                card.className = `option-card ${selectedIndex === opt.originalIndex ? 'selected' : ''}`;
                
                const badge = document.createElement('div');
                badge.className = 'option-badge';
                badge.innerText = letters[idx];
                
                const label = document.createElement('span');
                label.innerText = opt.text;
                
                card.appendChild(badge);
                card.appendChild(label);
                
                card.onclick = () => selectOption(opt.originalIndex);
                container.appendChild(card);
            });
        }

        function selectOption(originalIndex) {
            selectedIndex = originalIndex;
            renderOptionButtons();
            
            // Trigger sound on click feedback
            initAudio();
            if (audioCtx) {
                const clickOsc = audioCtx.createOscillator();
                const clickGain = audioCtx.createGain();
                clickOsc.connect(clickGain);
                clickGain.connect(audioCtx.destination);
                clickOsc.frequency.setValueAtTime(440, audioCtx.currentTime);
                clickGain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                clickGain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
                clickOsc.start();
                clickOsc.stop(audioCtx.currentTime + 0.16);
            }

            window.parent.postMessage({
                type: 'mcq-selected',
                optionIndex: originalIndex
            }, '*');
        }

        // Message Listener for hosting sandbox shuffling
        window.addEventListener('message', function(event) {
            if (event.data && event.data.type === 'init-mcq-options') {
                currentOptions = event.data.options;
                renderOptionButtons();
            }
        });

        // Interactive Handle Helpers
        function getLocalCoordinates(e) {
            const rect = canvas.getBoundingClientRect();
            // Map actual pixel sizes back to the logical 800 x 650 boundaries
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            
            const x = ((clientX - rect.left) / rect.width) * logicalWidth;
            const y = ((clientY - rect.top) / rect.height) * logicalHeight;
            return { x, y };
        }

        // Get coordinates of dynamic objects taking rotational tilt beam vector offset in mind
        function getObjectCoords(obj, isLeft) {
            const distance = isLeft ? -obj.d : obj.d;
            const screenX = pivotX + distance * Math.cos(beamAngle);
            const screenY = beamY + distance * Math.sin(beamAngle);
            return { x: screenX, y: screenY };
        }

        // Pointer event registration
        function onPointerDown(e) {
            initAudio();
            if (audioCtx && audioCtx.state === 'suspended') {
                audioCtx.resume();
            }

            const pt = getLocalCoordinates(e);
            
            const lCoords = getObjectCoords(leftObject, true);
            const rCoords = getObjectCoords(rightObject, false);

            const distToLeft = Math.hypot(pt.x - lCoords.x, pt.y - lCoords.y);
            const distToRight = Math.hypot(pt.x - rCoords.x, pt.y - rCoords.y);

            // Active dragging distance tolerance bounds
            if (distToLeft < 55) {
                leftObject.isDragging = true;
            } else if (distToRight < 55) {
                rightObject.isDragging = true;
            } else {
                isSweepingBackground = true;
                prevMouseX = pt.x;
            }
        }

        function onPointerMove(e) {
            const pt = getLocalCoordinates(e);

            if (leftObject.isDragging) {
                // Keep objects within clean mechanical margins on beam boundaries
                const dMin = 40;
                const dMax = 280;
                const distFromCenter = pivotX - pt.x;
                leftObject.targetD = Math.max(dMin, Math.min(dMax, distFromCenter));
            } else if (rightObject.isDragging) {
                const dMin = 40;
                const dMax = 280;
                const distFromCenter = pt.x - pivotX;
                rightObject.targetD = Math.max(dMin, Math.min(dMax, distFromCenter));
            } else if (isSweepingBackground && prevMouseX !== null) {
                const dx = pt.x - prevMouseX;
                targetWindForce = dx * 0.15;
                prevMouseX = pt.x;
            }
        }

        function onPointerUp() {
            leftObject.isDragging = false;
            rightObject.isDragging = false;
            isSweepingBackground = false;
            prevMouseX = null;
            targetWindForce = 0;
            if (audioCtx) {
                // Slowly fade audio when not interacting directly
                updateAudioSynth(beamAngle, false);
            }
        }

        // Register both touch and mouse interactions smoothly
        canvas.addEventListener('mousedown', onPointerDown);
        canvas.addEventListener('mousemove', onPointerMove);
        window.addEventListener('mouseup', onPointerUp);

        canvas.addEventListener('touchstart', (e) => { e.preventDefault(); onPointerDown(e); }, { passive: false });
        canvas.addEventListener('touchmove', (e) => { e.preventDefault(); onPointerMove(e); }, { passive: false });
        window.addEventListener('touchend', onPointerUp);

        // Core Elastic Spring Physics & Rendering Loop
        let lastTime = performance.now();
        
        function loop(timestamp) {
            const dt = Math.min((timestamp - lastTime) / 1000, 0.1); // Clamp timeline jumps
            lastTime = timestamp;

            // Simple spring inertia for object positions
            leftObject.d += (leftObject.targetD - leftObject.d) * 0.12;
            rightObject.d += (rightObject.targetD - rightObject.d) * 0.12;

            // Damp wind force
            windForce += (targetWindForce - windForce) * 0.08;

            // Torque formulation: force * distance
            // TorqueLeft is anti-clockwise, TorqueRight is clockwise
            const torqueLeft = leftObject.mass * leftObject.d;
            const torqueRight = rightObject.mass * rightObject.d;
            const netGravitationalTorque = (torqueRight - torqueLeft) * 0.0001; 

            // Physics spring parameters
            const kSpring = 3.5; 
            const damping = 2.0;

            const springRestoringTorque = -kSpring * beamAngle;
            const dampingTorque = -damping * angularVelocity;
            const customWindTorque = windForce * 0.2; // Allows user manual sweep tilts

            const totalTorque = netGravitationalTorque + springRestoringTorque + dampingTorque + customWindTorque;
            
            // Angular velocity calculation
            angularVelocity += totalTorque * dt * 60;
            beamAngle += angularVelocity * dt;

            // Clamp max physical boundaries to prevent flip over
            const maxTilt = 0.35; // radians (about 20 degrees)
            if (beamAngle > maxTilt) {
                beamAngle = maxTilt;
                angularVelocity = 0;
            } else if (beamAngle < -maxTilt) {
                beamAngle = -maxTilt;
                angularVelocity = 0;
            }

            // Sync dynamic pitch output
            const isAnyInteraction = leftObject.isDragging || rightObject.isDragging || Math.abs(windForce) > 0.05;
            updateAudioSynth(beamAngle, isAnyInteraction);

            renderCanvas();
            requestAnimationFrame(loop);
        }

        // Draw dynamic vectors & artistic illustrations on Canvas
        function renderCanvas() {
            // Apply scale handling for responsive Canvas resolution
            ctx.resetTransform();
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            const scaleX = width / logicalWidth;
            const scaleY = height / logicalHeight;
            ctx.scale(scaleX * window.devicePixelRatio, scaleY * window.devicePixelRatio);

            // DRAW PLAYGROUND SANDBOX DUST PARTICLES (Atmosphere)
            ctx.fillStyle = "rgba(255, 255, 255, 0.02)";
            for (let i = 0; i < 4; i++) {
                ctx.beginPath();
                ctx.arc(100 + i * 200, 150 + Math.sin(lastTime * 0.001 + i) * 10, 3, 0, Math.PI * 2);
                ctx.fill();
            }

            // 1. BEANSTALK AXIS LINE (Dynamic glowing neon vertical line of reference)
            ctx.save();
            ctx.strokeStyle = "rgba(57, 255, 20, 0.15)";
            ctx.lineWidth = 16;
            ctx.beginPath();
            ctx.moveTo(pivotX, 50);
            ctx.lineTo(pivotX, beamY + 120);
            ctx.stroke();

            ctx.strokeStyle = varColor('--accent-green');
            ctx.setLineDash([12, 12]);
            ctx.lineWidth = 4;
            ctx.shadowBlur = 10;
            ctx.shadowColor = varColor('--accent-green');
            ctx.beginPath();
            ctx.moveTo(pivotX, 40);
            ctx.lineTo(pivotX, beamY + 140);
            ctx.stroke();
            ctx.restore();

            // Beanstalk center label "AXIS OF REFERENCE"
            ctx.save();
            ctx.fillStyle = varColor('--accent-green');
            ctx.font = "bold 11px 'Fredoka', sans-serif";
            ctx.textAlign = "center";
            ctx.fillText("AXIS OF REFERENCE", pivotX, 35);
            ctx.restore();

            // 2. FULCRUM STAND (Sleeping dynamic shape)
            ctx.save();
            ctx.fillStyle = '#2d3748';
            ctx.strokeStyle = '#3a475c';
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.moveTo(pivotX, beamY - 5);
            ctx.lineTo(pivotX - 45, beamY + 120);
            ctx.lineTo(pivotX + 45, beamY + 120);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();

            // Sleeping smiley face on Fulcrum
            ctx.strokeStyle = '#a0aec0';
            ctx.lineWidth = 2.5;
            ctx.beginPath();
            ctx.arc(pivotX - 10, beamY + 65, 4, 0, Math.PI);
            ctx.arc(pivotX + 10, beamY + 65, 4, 0, Math.PI);
            ctx.stroke();
            
            // Sleepy zZZs
            ctx.fillStyle = '#a0aec0';
            ctx.font = "bold 12px 'Quicksand'";
            const zOffset = Math.sin(lastTime * 0.003) * 5;
            ctx.fillText("zZZ", pivotX + 22 + zOffset, beamY + 45 - zOffset);
            ctx.restore();

            // 3. SEESAW BEAM (Balanced platform)
            ctx.save();
            ctx.translate(pivotX, beamY);
            ctx.rotate(beamAngle);

            // Draw glowing under-board
            ctx.strokeStyle = "rgba(189, 147, 249, 0.15)";
            ctx.lineWidth = 24;
            ctx.beginPath();
            ctx.moveTo(-310, 0);
            ctx.lineTo(310, 0);
            ctx.stroke();

            // Draw primary playground board
            ctx.strokeStyle = varColor('--accent-purple');
            ctx.lineWidth = 14;
            ctx.lineCap = 'round';
            ctx.shadowBlur = 12;
            ctx.shadowColor = varColor('--accent-purple');
            ctx.beginPath();
            ctx.moveTo(-300, 0);
            ctx.lineTo(300, 0);
            ctx.stroke();

            // Board stripes
            ctx.strokeStyle = "#ffffff";
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(-290, -3); ctx.lineTo(-290, 3);
            ctx.moveTo(290, -3); ctx.lineTo(290, 3);
            ctx.stroke();
            ctx.restore();

            // 4. DRAW LEFT TOY ELEMENT
            const lCoords = getObjectCoords(leftObject, true);
            drawToy(lCoords.x, lCoords.y, leftObject, true);

            // 5. DRAW RIGHT TOY ELEMENT
            const rCoords = getObjectCoords(rightObject, false);
            drawToy(rCoords.x, rCoords.y, rightObject, false);

            // 6. DETAILED VECTOR RULER LABELS & FORCES (Tactile distance markers)
            drawVectorForceLine(lCoords.x, lCoords.y, leftObject, true);
            drawVectorForceLine(rCoords.x, rCoords.y, rightObject, false);

            // Draw balance status indicator if near level 0
            if (Math.abs(beamAngle) < 0.01) {
                ctx.save();
                ctx.fillStyle = varColor('--accent-green');
                ctx.font = "bold 18px 'Fredoka', sans-serif";
                ctx.textAlign = "center";
                ctx.shadowBlur = 10;
                ctx.shadowColor = varColor('--accent-green');
                ctx.fillText("✨ PERFECT BALANCE ✨", pivotX, beamY + 175);
                ctx.restore();
            }
        }

        // Helper to query element computed palette variables on runtime
        function varColor(cssVar) {
            return getComputedStyle(document.documentElement).getPropertyValue(cssVar).trim() || "#fff";
        }

        // Draw toys based on visual mode choice
        function drawToy(x, y, obj, isLeft) {
            ctx.save();
            ctx.translate(x, y - 25);
            ctx.shadowBlur = 12;

            if (balanceMode === 'asymmetrical') {
                if (isLeft) {
                    // CYAN HIPPO
                    ctx.fillStyle = varColor('--accent-cyan');
                    ctx.shadowColor = varColor('--accent-cyan');
                    
                    // Body
                    ctx.beginPath();
                    ctx.arc(0, 0, 32, 0, Math.PI * 2);
                    ctx.fill();
                    // Snout
                    ctx.beginPath();
                    ctx.arc(-15, 8, 18, 0, Math.PI * 2);
                    ctx.fill();
                    // Hippo Ears
                    ctx.beginPath();
                    ctx.arc(10, -26, 8, 0, Math.PI * 2);
                    ctx.arc(-22, -18, 8, 0, Math.PI * 2);
                    ctx.fill();
                    // Hippo happy eyes
                    ctx.strokeStyle = '#0b0f19';
                    ctx.lineWidth = 3.5;
                    ctx.lineCap = 'round';
                    ctx.beginPath();
                    ctx.arc(-10, -5, 3, 0, Math.PI, true);
                    ctx.stroke();
                } else {
                    // ORANGE BUNNY
                    ctx.fillStyle = varColor('--accent-orange');
                    ctx.shadowColor = varColor('--accent-orange');
                    
                    // Head
                    ctx.beginPath();
                    ctx.arc(0, 8, 14, 0, Math.PI * 2);
                    ctx.fill();
                    // Fluffy body
                    ctx.beginPath();
                    ctx.arc(10, 16, 18, 0, Math.PI * 2);
                    ctx.fill();
                    // Ears
                    ctx.beginPath();
                    ctx.ellipse(-4, -12, 5, 14, -Math.PI / 10, 0, Math.PI * 2);
                    ctx.ellipse(4, -12, 5, 14, Math.PI / 10, 0, Math.PI * 2);
                    ctx.fill();
                    // Cute eye
                    ctx.fillStyle = '#0b0f19';
                    ctx.beginPath();
                    ctx.arc(-4, 6, 2, 0, Math.PI * 2);
                    ctx.fill();
                }
            } else if (balanceMode === 'nearly' && !isLeft) {
                // SILLY TWIN WITH PARTY HAT
                ctx.fillStyle = varColor('--accent-pink');
                ctx.shadowColor = varColor('--accent-pink');
                
                // Cute round body
                ctx.beginPath();
                ctx.arc(0, 5, 24, 0, Math.PI * 2);
                ctx.fill();
                
                // Cute blinking/smiling face
                ctx.strokeStyle = '#0b0f19';
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.arc(-8, 2, 4, 0, Math.PI, true);
                ctx.arc(8, 2, 4, 0, Math.PI, true);
                ctx.stroke();
                // Rosy cheeks
                ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
                ctx.beginPath();
                ctx.arc(-14, 8, 4, 0, Math.PI * 2);
                ctx.arc(14, 8, 4, 0, Math.PI * 2);
                ctx.fill();

                // PARTY HAT OVERLAY (Bright Neon Yellow)
                ctx.fillStyle = varColor('--accent-yellow');
                ctx.shadowColor = varColor('--accent-yellow');
                ctx.beginPath();
                ctx.moveTo(-16, -14);
                ctx.lineTo(16, -14);
                ctx.lineTo(0, -48);
                ctx.closePath();
                ctx.fill();
                // Hat pom-pom
                ctx.fillStyle = '#fff';
                ctx.beginPath();
                ctx.arc(0, -50, 5, 0, Math.PI * 2);
                ctx.fill();
            } else {
                // STANDARD PERFECT SYMMETRICAL TWINS (Neon Pink)
                ctx.fillStyle = varColor('--accent-pink');
                ctx.shadowColor = varColor('--accent-pink');
                
                // Rounded dynamic cupcake-like blob
                ctx.beginPath();
                ctx.arc(0, 5, 24, 0, Math.PI * 2);
                ctx.fill();

                // Cheerful eyes & smiling face
                ctx.strokeStyle = '#0b0f19';
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.arc(-8, 0, 3, 0, Math.PI * 2);
                ctx.arc(8, 0, 3, 0, Math.PI * 2);
                ctx.stroke();
                // Smiling mouth
                ctx.beginPath();
                ctx.arc(0, 6, 6, 0, Math.PI);
                ctx.stroke();
            }

            // Draw drag handle crown indicator (Little neon star hovering)
            if (obj.isDragging) {
                ctx.fillStyle = '#ffffff';
                ctx.shadowColor = '#ffffff';
                ctx.shadowBlur = 15;
                ctx.beginPath();
                ctx.arc(0, -32, 6, 0, Math.PI * 2);
                ctx.fill();
            } else {
                // Dim helper arrow
                ctx.strokeStyle = "rgba(255,255,255,0.4)";
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(-10, -34); ctx.lineTo(-15, -30); ctx.lineTo(-10, -26);
                ctx.moveTo(10, -34); ctx.lineTo(15, -30); ctx.lineTo(10, -26);
                ctx.stroke();
            }

            ctx.restore();
        }

        function drawVectorForceLine(x, y, obj, isLeft) {
            // Draw interactive distance indicator line below elements
            ctx.save();
            ctx.strokeStyle = "rgba(255, 255, 255, 0.2)";
            ctx.lineWidth = 2;
            ctx.setLineDash([4, 4]);
            ctx.beginPath();
            ctx.moveTo(x, y - 5);
            ctx.lineTo(x, y + 45);
            ctx.stroke();

            // Label text of weight & relative distance
            ctx.fillStyle = "#ffffff";
            ctx.font = "bold 13px 'Fredoka', sans-serif";
            ctx.textAlign = "center";
            ctx.fillText(obj.label, x, y - 68);

            ctx.fillStyle = varColor('--accent-cyan');
            ctx.font = "normal 11px 'Quicksand', sans-serif";
            ctx.fillText(`Distance: ${Math.round(obj.d)}m`, x, y + 58);
            ctx.fillText(`Weight: ${obj.mass}kg`, x, y + 74);
            ctx.restore();
        }

        // Fire-up loop
        setMode('symmetrical');
        renderOptionButtons();
        requestAnimationFrame(loop);
    </script>
</body>
</html>
