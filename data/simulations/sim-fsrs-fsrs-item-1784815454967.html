<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Cozy-Cube Squish-o-Meter</title>
    <style>
        body { margin: 0; background: #1a1a2e; color: #e0e0e0; font-family: 'Segoe UI', sans-serif; overflow: hidden; display: flex; flex-direction: column; align-items: center; }
        canvas { cursor: crosshair; touch-action: none; border-radius: 20px; box-shadow: 0 0 50px rgba(0,0,0,0.5); }
        #ui-layer { position: absolute; bottom: 20px; text-align: center; pointer-events: none; }
        .math-cloud { background: rgba(255,255,255,0.1); padding: 15px; border-radius: 15px; backdrop-filter: blur(10px); pointer-events: auto; }
        #puzzle-zone { margin-top: 20px; display: flex; gap: 10px; }
        .slot { width: 60px; height: 40px; border: 2px dashed #ff9a9e; display: flex; align-items: center; justify-content: center; cursor: pointer; }
        .draggable { background: #6a11cb; padding: 5px 10px; border-radius: 5px; cursor: grab; }
    </style>
</head>
<body>

<canvas id="simCanvas"></canvas>
<div id="ui-layer">
    <div class="math-cloud">
        <h2 id="comfort-text">Comfort: 1.00</h2>
        <div id="formula-display">C = k · ln(V) - (α · 1/d²)</div>
    </div>
    <div id="puzzle-zone">
        <div class="slot" data-target="k">k</div>
        <div class="slot" data-target="V">V</div>
        <div class="slot" data-target="d">d</div>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
<script>
    const canvas = document.getElementById('simCanvas');
    const ctx = canvas.getContext('2d');
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    let osc = null, gainNode = null;
    let d = 100, V = 50000, alpha = 500, comfort = 1;
    let speaking = false;

    function initAudio() {
        osc = audioCtx.createOscillator();
        gainNode = audioCtx.createGain();
        osc.connect(gainNode);
        gainNode.connect(audioCtx.destination);
        osc.start();
        gainNode.gain.value = 0.1;
    }

    function update() {
        // Mechanism 10 Logic
        let invSq = alpha * (1 / Math.pow(d / 2, 2));
        comfort = (0.5 * Math.log(V / 1000)) - (invSq / 100);
        
        // Visuals
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        const size = d * 2;
        
        // Glow/Heatmap
        const stress = Math.max(0, 1 - comfort);
        ctx.strokeStyle = `rgba(255, ${255 - stress * 255}, ${255 - stress * 255}, 0.8)`;
        ctx.lineWidth = 10 + stress * 20;
        ctx.strokeRect(canvas.width/2 - size/2, canvas.height/2 - size/2, size, size);

        // Particle
        const particleColor = comfort > 0.3 ? "#ffeb3b" : "#9c27b0";
        const jitter = comfort < 0.3 ? Math.random() * 10 : 0;
        ctx.fillStyle = particleColor;
        ctx.beginPath();
        ctx.arc(canvas.width/2 + jitter, canvas.height/2 + jitter, 20, 0, Math.PI * 2);
        ctx.fill();

        // Audio Update
        if (osc) {
            osc.frequency.value = 100 + (Math.max(0, 1 - comfort) * 400);
        }

        // Narrator
        if (comfort < 0.3 && !speaking) {
            speaking = true;
            const msg = new SpeechSynthesisUtterance("Oh no! The walls are hugging too tight! Let's give our friend some breathing room.");
            window.speechSynthesis.speak(msg);
            setTimeout(() => speaking = false, 5000);
        }

        document.getElementById('comfort-text').innerText = `Comfort Score: ${comfort.toFixed(2)}`;
        requestAnimationFrame(update);
    }

    // Resize and Interaction
    function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight * 0.7;
    }
    window.addEventListener('resize', resize);
    window.addEventListener('mousemove', (e) => {
        d = Math.max(20, Math.min(300, e.clientX / 3));
    });
    window.addEventListener('mousedown', () => { if(!osc) initAudio(); });
    
    resize();
    update();
</script>
</body>
</html>
