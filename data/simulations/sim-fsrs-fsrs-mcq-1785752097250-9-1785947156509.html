<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rhythm Builder Sandbox</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            overflow: hidden; /* Prevent scrollbars from overall container */
        }
        #mcq-simulation {
            width: 100%;
            height: 100vh; /* Use 100vh to fill viewport height */
            display: flex;
            font-family: 'Roboto Mono', monospace;
            background: linear-gradient(135deg, #1a0f3d, #0a051c);
            color: #e0e0ff;
            box-sizing: border-box; /* Ensure padding/border is included in element's total width and height */
        }
        #rhythm-builder-canvas {
            flex: 3; /* 70% width */
            background-color: rgba(0,0,0,0.3);
            border-right: 2px solid #5a2c8a;
            display: block; /* Remove extra space below canvas */
        }
        #control-panel {
            flex: 1; /* 30% width */
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            background-color: rgba(0,0,0,0.4);
            border-left: 2px solid #3d1b64;
            box-sizing: border-box;
            overflow-y: auto; /* Allow scrolling for control panel if content overflows */
        }
        .slider-group {
            margin-bottom: 25px;
        }

        /* Cyber-Themed Slider Styling */
        .cyber-slider {
            -webkit-appearance: none;
            appearance: none;
            width: calc(100% - 60px); /* Adjust for value display */
            height: 10px;
            background: rgba(100, 100, 255, 0.2);
            outline: none;
            border-radius: 5px;
            margin-right: 10px;
            box-shadow: inset 0 0 5px rgba(100, 100, 255, 0.5);
        }
        .cyber-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #00ffff; /* Neon cyan */
            cursor: grab;
            box-shadow: 0 0 10px #00ffff;
            transition: background 0.2s, box-shadow 0.2s;
        }
        .cyber-slider::-moz-range-thumb {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #00ffff; /* Neon cyan */
            cursor: grab;
            box-shadow: 0 0 10px #00ffff;
            transition: background 0.2s, box-shadow 0.2s;
            border: none;
        }
        .cyber-slider::-webkit-slider-thumb:hover {
            background: #00e0e0;
            box-shadow: 0 0 15px #00e0e0;
        }
        .cyber-slider::-moz-range-thumb:hover {
            background: #00e0e0;
            box-shadow: 0 0 15px #00e0e0;
        }
        
        #read-listen-button {
            background-color: #5a2c8a;
            color: #fff;
            border: none;
            padding: 12px 15px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1.1em;
            margin-top: 15px;
            box-shadow: 0 0 15px #5a2c8a;
            transition: all 0.2s ease-in-out;
        }
        #read-listen-button:hover {
            background-color: #6d399d;
            box-shadow: 0 0 20px #6d399d;
            transform: translateY(-2px);
        }
        #read-listen-button:active {
            background-color: #45216e;
            box-shadow: 0 0 10px #45216e;
            transform: translateY(0);
        }

        .mcq-option-button {
            background-color: rgba(100, 100, 255, 0.1);
            color: #e0e0ff;
            border: 1px solid #5a2c8a;
            padding: 10px 15px;
            border-radius: 5px;
            cursor: pointer;
            text-align: left;
            transition: all 0.2s ease-in-out;
            font-size: 0.9em;
        }
        .mcq-option-button:hover {
            background-color: rgba(100, 100, 255, 0.2);
            border-color: #8a4edc;
            box-shadow: 0 0 8px #8a4edc;
        }
        .mcq-option-button:active {
            background-color: rgba(100, 100, 255, 0.3);
            box-shadow: 0 0 12px #8a4edc;
            transform: scale(0.98);
        }
    </style>
</head>
<body>

<div id="mcq-simulation">
    
    <!-- Canvas for interactive visuals -->
    <canvas id="rhythm-builder-canvas"></canvas>

    <!-- Control Panel & MCQ Sidebar -->
    <div id="control-panel">
        
        <!-- Simulation Intro / Title -->
        <h2 style="color: #ffcc00; text-align: center; margin-bottom: 20px; text-shadow: 0 0 8px #ffcc00;">Rhythm Builder Sandbox!</h2>
        <p style="font-size: 0.9em; text-align: center; margin-bottom: 20px;">Help our block friends dance to your rhythm!</p>

        <!-- Sliders for Manipulation -->
        <div class="slider-group">
            <label for="num-blocks-slider" style="display: block; margin-bottom: 8px; color: #aaffaa; text-shadow: 0 0 5px #aaffaa;">Number of Friends:</label>
            <input type="range" id="num-blocks-slider" min="3" max="15" value="7" class="cyber-slider">
            <span id="num-blocks-value" style="float: right; color: #aaffaa;">7</span>
        </div>
        <div class="slider-group">
            <label for="spacing-slider" style="display: block; margin-bottom: 8px; color: #aaeaff; text-shadow: 0 0 5px #aaeaff;">Step-by-Step Distance:</label>
            <input type="range" id="spacing-slider" min="50" max="200" value="120" class="cyber-slider">
            <span id="spacing-value" style="float: right; color: #aaeaff;">120px</span>
        </div>
        <div class="slider-group">
            <label for="progression-slider" style="display: block; margin-bottom: 8px; color: #ffaaee; text-shadow: 0 0 5px #ffaaee;">Grow-or-Shrink Surprise:</label>
            <input type="range" id="progression-slider" min="-0.05" max="0.05" step="0.005" value="0" class="cyber-slider">
            <span id="progression-value" style="float: right; color: #ffaaee;">0</span>
        </div>

        <!-- Read/Listen Button -->
        <button id="read-listen-button">
            🔊 Read Question & Options
        </button>

        <!-- MCQ Question and Options -->
        <div style="margin-top: 30px;">
            <p id="mcq-question-text" style="font-weight: bold; font-size: 1.1em; color: #ffcc00; text-shadow: 0 0 5px #ffcc00; margin-bottom: 15px;">
                How is "Rhythm" typically created and manipulated within architectural compositions?
            </p>
            <div id="mcq-options" style="display: flex; flex-direction: column; gap: 10px;">
                <!-- Option buttons will be dynamically inserted here -->
            </div>
        </div>
    </div>
</div>

<script>
    // Global state variables
    let simulationCanvas, ctx;
    let audioContext, numBlocksOscillator, spacingOscillator, progressionOscillator, mainGainNode, progressionGain;
    let blockParams = { numBlocks: 7, spacing: 120, progression: 0 };
    let blocks = []; // Array of block objects { x, y, size, color, targetX, targetY, velocityY }
    let mouse = { x: 0, y: 0, isDown: false, lastX: 0, canvasX: 0, canvasY: 0, lastCanvasX: 0 };
    let currentShuffledOptions = [];
    let particles = [];
    let speechTimeout;

    // --- Initialization ---
    function initSimulation() {
        simulationCanvas = document.getElementById('rhythm-builder-canvas');
        ctx = simulationCanvas.getContext('2d');
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        setupAudio();
        createBlocks(); // Initial block setup

        // Setup slider event listeners and connect to audio/visuals
        setupSliders();

        // Setup mouse/touch event listeners for sweep gesture
        setupGestureDetection();

        // Start the animation loop
        requestAnimationFrame(animate);

        // Initial friendly narration
        speak("Hey there, little architect! Welcome to our Super Duper Rhythm Builder! Let's make some fun rhythms with blocks!");
    }

    // --- Canvas Resizing ---
    function resizeCanvas() {
        const container = document.getElementById('mcq-simulation');
        simulationCanvas.width = container.offsetWidth * 0.7;
        simulationCanvas.height = container.offsetHeight;
        // Re-create blocks to adjust to new canvas size
        createBlocks(false); // Do not trigger bounce on initial resize
    }

    // --- Web Audio Setup ---
    function setupAudio() {
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
        mainGainNode = audioContext.createGain();
        mainGainNode.gain.value = 0.2; // Master volume
        mainGainNode.connect(audioContext.destination);

        // Oscillator for Number of Blocks (controls overall "tempo" pitch)
        numBlocksOscillator = audioContext.createOscillator();
        numBlocksOscillator.type = 'sine';
        numBlocksOscillator.frequency.value = 440; // Default A4
        numBlocksOscillator.connect(mainGainNode);
        numBlocksOscillator.start();

        // Oscillator for Spacing (controls "density" pitch)
        spacingOscillator = audioContext.createOscillator();
        spacingOscillator.type = 'triangle';
        spacingOscillator.frequency.value = 600; // Default
        spacingOscillator.connect(mainGainNode);
        spacingOscillator.start();

        // Oscillator for Progression (modulates main pitch/volume for 'wobble' effect)
        progressionOscillator = audioContext.createOscillator();
        progressionOscillator.type = 'sawtooth';
        progressionOscillator.frequency.value = 1; // Slow modulation
        progressionGain = audioContext.createGain(); // Initialize progressionGain
        progressionGain.gain.value = 0; // Starts at 0, increases with progression
        progressionOscillator.connect(progressionGain);
        progressionGain.connect(numBlocksOscillator.frequency); // Modulate numBlocksOscillator freq
        progressionGain.connect(spacingOscillator.frequency); // Modulate spacingOscillator freq
        progressionOscillator.start();
    }

    // --- Slider Event Handlers ---
    function debouncedSpeak(text) {
        clearTimeout(speechTimeout);
        speechTimeout = setTimeout(() => speak(text), 700); // 700ms debounce
    }

    function setupSliders() {
        const numBlocksSlider = document.getElementById('num-blocks-slider');
        const spacingSlider = document.getElementById('spacing-slider');
        const progressionSlider = document.getElementById('progression-slider');

        numBlocksSlider.addEventListener('input', (e) => {
            blockParams.numBlocks = parseInt(e.target.value);
            document.getElementById('num-blocks-value').textContent = blockParams.numBlocks;
            numBlocksOscillator.frequency.value = 200 + (blockParams.numBlocks / 15) * 800; // 200Hz-1000Hz
            createBlocks(true); // Trigger bounce
            debouncedSpeak("You changed the number of friends! More friends, faster rhythm!");
        });
        spacingSlider.addEventListener('input', (e) => {
            blockParams.spacing = parseInt(e.target.value);
            document.getElementById('spacing-value').textContent = blockParams.spacing + "px";
            spacingOscillator.frequency.value = 1000 - (blockParams.spacing / 200) * 800; // 1000Hz-200Hz
            createBlocks(true); // Trigger bounce
            debouncedSpeak("You changed the step-by-step distance! Wider space, slower rhythm!");
        });
        progressionSlider.addEventListener('input', (e) => {
            blockParams.progression = parseFloat(e.target.value);
            document.getElementById('progression-value').textContent = blockParams.progression.toFixed(3);
            
            const absProgression = Math.abs(blockParams.progression);
            progressionOscillator.frequency.value = 1 + absProgression * 5; // Faster wobble for higher progression
            progressionGain.gain.value = absProgression * 50; // More modulation depth
            
            createBlocks(true); // Trigger bounce
            debouncedSpeak("Wow, a grow-or-shrink surprise! Makes the rhythm bouncy!");
        });
    }

    // --- Gesture Detection ---
    function setupGestureDetection() {
        simulationCanvas.addEventListener('mousedown', (e) => { 
            mouse.isDown = true; 
            const rect = simulationCanvas.getBoundingClientRect();
            mouse.canvasX = e.clientX - rect.left;
            mouse.canvasY = e.clientY - rect.top;
            mouse.lastCanvasX = mouse.canvasX;
        });
        simulationCanvas.addEventListener('mouseup', () => { mouse.isDown = false; });
        simulationCanvas.addEventListener('mousemove', (e) => {
            if (!mouse.isDown) return;

            const rect = simulationCanvas.getBoundingClientRect();
            mouse.canvasX = e.clientX - rect.left;
            mouse.canvasY = e.clientY - rect.top;
            
            let dx = mouse.canvasX - mouse.lastCanvasX;
            if (Math.abs(dx) > 30) { // Threshold for sweep detection
                triggerSweepEffect();
                mouse.lastCanvasX = mouse.canvasX; // Reset for next sweep
            }
        });
        
        // Add touch events for mobile compatibility
        simulationCanvas.addEventListener('touchstart', (e) => {
            mouse.isDown = true;
            const touch = e.touches[0];
            const rect = simulationCanvas.getBoundingClientRect();
            mouse.canvasX = touch.clientX - rect.left;
            mouse.canvasY = touch.clientY - rect.top;
            mouse.lastCanvasX = mouse.canvasX;
            e.preventDefault(); // Prevent scrolling/zooming
        }, { passive: false });
        
        simulationCanvas.addEventListener('touchend', () => { mouse.isDown = false; });
        
        simulationCanvas.addEventListener('touchmove', (e) => {
            if (!mouse.isDown) return;
            const touch = e.touches[0];
            const rect = simulationCanvas.getBoundingClientRect();
            mouse.canvasX = touch.clientX - rect.left;
            mouse.canvasY = touch.clientY - rect.top;

            let dx = mouse.canvasX - mouse.lastCanvasX;
            if (Math.abs(dx) > 30) {
                triggerSweepEffect();
                mouse.lastCanvasX = mouse.canvasX;
            }
            e.preventDefault(); // Prevent scrolling
        }, { passive: false });
    }

    // --- Block Management ---
    function createBlocks(triggerBounce = false) {
        blocks = [];
        const baseY = simulationCanvas.height * 0.75;
        const baseBlockSize = 50;
        let calculatedBlockSizes = [];

        // First pass: Calculate sizes
        for (let i = 0; i < blockParams.numBlocks; i++) {
            let size = baseBlockSize * (1 + blockParams.progression * i);
            size = Math.max(20, Math.min(100, size)); // Clamp size for visual appeal
            calculatedBlockSizes.push(size);
        }

        // Calculate total width of all blocks + spacing
        let totalContentWidth = 0;
        for (let i = 0; i < blockParams.numBlocks; i++) {
            totalContentWidth += calculatedBlockSizes[i];
            if (i < blockParams.numBlocks - 1) {
                totalContentWidth += blockParams.spacing;
            }
        }

        const startDrawingX = (simulationCanvas.width / 2) - (totalContentWidth / 2);
        let currentBlockDrawingX = startDrawingX;

        // Second pass: Create blocks with calculated positions
        for (let i = 0; i < blockParams.numBlocks; i++) {
            let size = calculatedBlockSizes[i];
            let blockCenterX = currentBlockDrawingX + size / 2;

            blocks.push({
                id: i,
                x: blockCenterX,
                y: baseY - size / 2, // Top-left for drawing, block.x is center
                targetX: blockCenterX,
                targetY: baseY - size / 2,
                size: size,
                color: getRandomPastelColor(),
                velocityY: triggerBounce ? (-2 - Math.random() * 2) : 0 // Small initial jump if triggered
            });

            currentBlockDrawingX += size + blockParams.spacing;
        }
    }

    function getRandomPastelColor() {
        const hue = Math.floor(Math.random() * 360);
        return `hsl(${hue}, 80%, 75%)`; // Lighter saturation for pastel
    }

    // --- Animation Loop ---
    function animate() {
        ctx.clearRect(0, 0, simulationCanvas.width, simulationCanvas.height);

        // Draw cyber grid background
        drawCyberGrid();

        blocks.forEach(block => {
            // Apply simple physics for bounce effect
            block.velocityY += 0.5; // Gravity
            block.y += block.velocityY;
            if (block.y + block.size / 2 > simulationCanvas.height * 0.75) { // Hit ground
                block.y = simulationCanvas.height * 0.75 - block.size / 2;
                if (block.velocityY > 0) block.velocityY *= -0.6; // Bounce damping
            }

            // Interpolate towards target X (for smooth re-arrangement)
            block.x += (block.targetX - block.x) * 0.1;

            // Draw block (3D-ish effect)
            drawBlock(block);
        });

        // Update and draw particles
        for (let i = particles.length - 1; i >= 0; i--) {
            let p = particles[i];
            p.x += p.vx;
            p.y += p.vy;
            p.life--;
            
            // Fade out
            const alpha = p.life / 60;
            ctx.fillStyle = p.color.replace(/[^,]+(?=\)$)/, alpha.toFixed(2));

            ctx.beginPath();
            ctx.arc(p.x, p.y, 3, 0, Math.PI * 2);
            ctx.fill();

            if (p.life <= 0) {
                particles.splice(i, 1);
            }
        }

        requestAnimationFrame(animate);
    }

    function drawBlock(block) {
        const halfSize = block.size / 2;
        const offset = 10; // For 3D depth

        // Perspective effect
        const perspectiveFactor = 0.8; 
        const offsetX = offset;
        const offsetY = offset;

        // Top face (lighter)
        ctx.fillStyle = `hsl(${parseInt(block.color.substring(4).split(',')[0])}, 70%, 85%)`; 
        ctx.beginPath();
        ctx.moveTo(block.x - halfSize, block.y - halfSize);
        ctx.lineTo(block.x - halfSize + offsetX * perspectiveFactor, block.y - halfSize - offsetY * perspectiveFactor);
        ctx.lineTo(block.x + halfSize + offsetX * perspectiveFactor, block.y - halfSize - offsetY * perspectiveFactor);
        ctx.lineTo(block.x + halfSize, block.y - halfSize);
        ctx.closePath();
        ctx.fill();

        // Right face (darker)
        ctx.fillStyle = `hsl(${parseInt(block.color.substring(4).split(',')[0])}, 70%, 65%)`; 
        ctx.beginPath();
        ctx.moveTo(block.x + halfSize, block.y - halfSize);
        ctx.lineTo(block.x + halfSize + offsetX * perspectiveFactor, block.y - halfSize - offsetY * perspectiveFactor);
        ctx.lineTo(block.x + halfSize + offsetX * perspectiveFactor, block.y + halfSize - offsetY * perspectiveFactor);
        ctx.lineTo(block.x + halfSize, block.y + halfSize);
        ctx.closePath();
        ctx.fill();

        // Front face (draw last to be on top)
        ctx.fillStyle = block.color;
        ctx.fillRect(block.x - halfSize, block.y - halfSize, block.size, block.size);
        ctx.strokeStyle = '#e0e0ff'; // Neon outline
        ctx.lineWidth = 2;
        ctx.strokeRect(block.x - halfSize, block.y - halfSize, block.size, block.size);
    }

    function drawCyberGrid() {
        ctx.strokeStyle = 'rgba(0, 255, 255, 0.05)'; // Faint cyan grid
        ctx.lineWidth = 1;

        // Vertical lines
        for (let i = 0; i < simulationCanvas.width; i += 50) {
            ctx.beginPath();
            ctx.moveTo(i, 0);
            ctx.lineTo(i, simulationCanvas.height);
            ctx.stroke();
        }
        // Horizontal lines
        for (let i = 0; i < simulationCanvas.height; i += 50) {
            ctx.beginPath();
            ctx.moveTo(0, i);
            ctx.lineTo(simulationCanvas.width, i);
            ctx.stroke();
        }

        // Glowing floor line
        const floorY = simulationCanvas.height * 0.75;
        ctx.beginPath();
        ctx.moveTo(0, floorY);
        ctx.lineTo(simulationCanvas.width, floorY);
        ctx.strokeStyle = 'rgba(0, 255, 255, 0.5)'; // Brighter cyan for floor
        ctx.lineWidth = 3;
        ctx.shadowBlur = 15;
        ctx.shadowColor = '#00ffff';
        ctx.stroke();
        ctx.shadowBlur = 0; // Reset shadow
    }

    // --- Sweep Effect ---
    function triggerSweepEffect() {
        blocks.forEach(block => {
            block.velocityY = -10 - Math.random() * 5; // Jump up with random force
        });
        playCheerSound();
        // Create particles at mouse position
        for (let i = 0; i < 10; i++) {
            particles.push({
                x: mouse.canvasX,
                y: mouse.canvasY,
                vx: (Math.random() - 0.5) * 10,
                vy: (Math.random() - 0.5) * 10,
                life: 60, // frames
                color: `rgba(0, 255, 255, 1)` // Cyan glow with full alpha
            });
        }
        debouncedSpeak("Woosh! You made our block friends do a little bounce! That's you making the rhythm happen, super builder!");
    }

    function playCheerSound() {
        const bouncer = audioContext.createOscillator();
        const bouncerGain = audioContext.createGain();
        bouncer.type = 'sine'; // Soft boing
        bouncer.frequency.value = 800 + Math.random() * 400; // High pitch
        bouncerGain.gain.value = 0.4;
        bouncer.connect(bouncerGain);
        bouncerGain.connect(mainGainNode); // Connect to main gain
        bouncer.start();
        bouncerGain.gain.exponentialRampToValueAtTime(0.0001, audioContext.currentTime + 0.5);
        bouncer.stop(audioContext.currentTime + 0.5);
    }

    // --- Web Speech Synthesis ---
    function speak(text) {
        if (window.speechSynthesis) {
            window.speechSynthesis.cancel(); // Stop any current speech
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'en-US';
            utterance.pitch = 1.2; // Childlike voice
            utterance.rate = 1.1; // Slightly faster
            window.speechSynthesis.speak(utterance);
        } else {
            console.warn("Speech Synthesis not supported in this browser.");
        }
    }

    // --- MCQ Logic ---
    window.addEventListener('init-mcq-options', (event) => {
        currentShuffledOptions = event.detail.options;
        const optionsContainer = document.getElementById('mcq-options');
        optionsContainer.innerHTML = ''; // Clear previous options
        currentShuffledOptions.forEach((option, index) => {
            const button = document.createElement('button');
            button.className = 'mcq-option-button';
            button.textContent = String.fromCharCode(65 + index) + ") " + option.text;
            button.onclick = () => {
                window.parent.postMessage({
                    type: 'mcq-selected',
                    optionIndex: option.originalIndex
                }, '*');
            };
            optionsContainer.appendChild(button);
        });
    });

    document.getElementById('read-listen-button').addEventListener('click', () => {
        let textToSpeak = document.getElementById('mcq-question-text').textContent;
        if (currentShuffledOptions.length > 0) {
            textToSpeak += " Here are the options: ";
            currentShuffledOptions.forEach((option, index) => {
                textToSpeak += ` Option ${String.fromCharCode(65 + index)}. ${option.text}.`;
            });
        } else {
            textToSpeak += " The options are loading. Please wait.";
        }
        speak(textToSpeak);
    });

    // --- Start the simulation when the window loads ---
    window.onload = initSimulation;
</script>

</body>
</html>
