<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rail Gauge Classification Lab</title>
    <style>
        :root {
            --bg: #0a0b10;
            --glass: rgba(255, 255, 255, 0.05);
            --neon-cyan: #00f2ff;
            --neon-magenta: #ff00ff;
            --neon-green: #00ff9f;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: var(--bg); color: white; height: 100vh; overflow: hidden; display: flex; }

        /* Layout */
        #app-container { display: grid; grid-template-columns: 1fr 350px; width: 100vw; height: 100vh; gap: 10px; padding: 10px; }
        
        /* Canvas Area */
        #lab-bench { position: relative; background: radial-gradient(circle at center, #161b22, #0a0b10); border: 1px solid var(--glass); border-radius: 12px; overflow: hidden; }
        canvas { display: block; width: 100%; height: 100%; cursor: crosshair; }

        /* UI Panel */
        #controls { display: flex; flex-direction: column; gap: 15px; background: var(--glass); backdrop-filter: blur(10px); padding: 20px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); }
        .card { background: rgba(0,0,0,0.3); padding: 15px; border-radius: 8px; border-left: 3px solid var(--neon-cyan); }
        
        .draggable { cursor: grab; padding: 10px; background: #222; margin-bottom: 8px; border: 1px solid #444; border-radius: 4px; text-align: center; transition: 0.3s; }
        .draggable:hover { border-color: var(--neon-cyan); }

        #overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: none; background: rgba(0,0,0,0.8); z-index: 10; justify-content: center; align-items: center; }
        .modal { background: #1a1a1a; padding: 30px; border-radius: 15px; border: 1px solid var(--neon-magenta); text-align: center; }

        button { padding: 10px 20px; background: transparent; border: 1px solid var(--neon-cyan); color: var(--neon-cyan); cursor: pointer; transition: 0.3s; }
        button:hover { background: var(--neon-cyan); color: black; }
    </style>
</head>
<body>

<div id="app-container">
    <div id="lab-bench">
        <canvas id="gaugeCanvas"></canvas>
    </div>
    <div id="controls">
        <h3>Gauge Calibration Kit</h3>
        <div id="drop-zone-container">
            <div class="card" id="slot-1676" data-gauge="1676">Broad Gauge: 1676mm</div>
            <div class="card" id="slot-1000" data-gauge="1000">Metre Gauge: 1000mm</div>
            <div class="card" id="slot-762" data-gauge="762">Narrow Gauge: 762mm</div>
        </div>
        <div id="toolbox">
            <div class="draggable" draggable="true" ondragstart="drag(event)" id="card-1676">1676 mm</div>
            <div class="draggable" draggable="true" ondragstart="drag(event)" id="card-1000">1000 mm</div>
            <div class="draggable" draggable="true" ondragstart="drag(event)" id="card-762">762 mm</div>
        </div>
        <button onclick="resetLab()">Reset System</button>
    </div>
</div>

<div id="overlay"><div class="modal"><h2>Calibration Complete</h2><p>Engineering Standards Validated.</p><button onclick="closeModal()">Close</button></div></div>

<script>
    const canvas = document.getElementById('gaugeCanvas');
    const ctx = canvas.getContext('2d');
    let audioCtx, oscillator;
    let droppedCount = 0;

    function resizeCanvas() {
        const rect = canvas.getBoundingClientRect();
        const dpr = window.devicePixelRatio || 1;
        canvas.width = rect.width * dpr;
        canvas.height = rect.height * dpr;
        ctx.scale(dpr, dpr);
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // Audio Logic
    function initAudio() {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }

    function playTone(freq) {
        initAudio();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.5);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.5);
    }

    // Drag & Drop
    function drag(ev) { ev.dataTransfer.setData("text", ev.target.id); }
    
    document.querySelectorAll('.card').forEach(slot => {
        slot.addEventListener('dragover', e => e.preventDefault());
        slot.addEventListener('drop', e => {
            const id = e.dataTransfer.getData("text");
            const val = id.split('-')[1];
            if(e.target.dataset.gauge === val) {
                e.target.style.borderColor = 'var(--neon-green)';
                document.getElementById(id).style.display = 'none';
                droppedCount++;
                playTone(600);
                speak(`Correct. ${e.target.innerText.split(':')[0]}, the standard.`);
                if(droppedCount === 3) document.getElementById('overlay').style.display = 'flex';
            } else {
                playTone(150);
            }
        });
    });

    function speak(text) {
        window.speechSynthesis.cancel();
        const msg = new SpeechSynthesisUtterance(text);
        window.speechSynthesis.speak(msg);
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        const w = canvas.width / window.devicePixelRatio;
        const h = canvas.height / window.devicePixelRatio;
        
        ctx.strokeStyle = '#333';
        ctx.lineWidth = 40;
        // Rails
        [100, 200, 300].forEach((y, i) => {
            ctx.beginPath();
            ctx.moveTo(50, y); ctx.lineTo(w - 50, y);
            ctx.stroke();
            ctx.fillStyle = "white";
            ctx.font = "14px Arial";
            ctx.fillText(`Track ${i+1}`, 60, y - 25);
        });
        
        requestAnimationFrame(draw);
    }

    function resetLab() {
        location.reload();
    }

    function closeModal() {
        document.getElementById('overlay').style.display = 'none';
    }

    draw();
</script>
</body>
</html>
