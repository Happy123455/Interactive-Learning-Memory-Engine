<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Interactive Engineering Simulation</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-[#080a10] text-slate-100 min-h-screen overflow-x-hidden">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

// Inject custom style tags for animations and glassmorphic designs
const injectStyles = () => {
  if (typeof document === 'undefined') return;
  const styleId = 'summit-curve-simulation-styles';
  if (document.getElementById(styleId)) return;

  const style = document.createElement('style');
  style.id = styleId;
  style.innerHTML = `
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap');
    
    body {
      font-family: 'Inter', sans-serif;
      background-color: #0c0e14;
      color: #e2e8f0;
      overflow-x: hidden;
    }

    .glass-panel {
      background: rgba(18, 22, 33, 0.7);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .neon-text-cyan {
      text-shadow: 0 0 10px rgba(6, 182, 212, 0.6), 0 0 20px rgba(6, 182, 212, 0.3);
    }

    .neon-text-orange {
      text-shadow: 0 0 10px rgba(249, 115, 22, 0.6), 0 0 20px rgba(249, 115, 22, 0.3);
    }

    .neon-border-cyan {
      box-shadow: 0 0 15px rgba(6, 182, 212, 0.25);
    }

    .custom-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #06b6d4;
      cursor: pointer;
      box-shadow: 0 0 10px rgba(6, 182, 212, 0.8);
      transition: all 0.2s ease;
    }

    .custom-slider::-webkit-slider-thumb:hover {
      transform: scale(1.2);
      background: #22d3ee;
    }

    .font-mono-custom {
      font-family: 'JetBrains Mono', monospace;
    }

    /* Scrollbar style */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(18, 22, 33, 0.5);
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(6, 182, 212, 0.3);
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(6, 182, 212, 0.5);
    }

    @keyframes pulse-ring {
      0% { transform: scale(0.95); opacity: 0.8; }
      50% { transform: scale(1.1); opacity: 0.4; }
      100% { transform: scale(0.95); opacity: 0.8; }
    }

    .pulse-handle {
      animation: pulse-ring 2s infinite ease-in-out;
    }
  `;
  document.head.appendChild(style);
};

function App() {
  useEffect(() => {
    injectStyles();
  }, []);

  // Primary State Objects
  const [V, setV] = useState(80); // Speed in Kmph (60 to 120)
  const [n1, setN1] = useState(4.0); // Entering Gradient % (1% to 10%)
  const [n2, setN2] = useState(-4.0); // Exiting Gradient % (-1% to -10%)
  const [f, setF] = useState(0.35); // Longitudinal friction coefficient
  const [t, setT] = useState(2.5); // Perception-Reaction Time (seconds)
  const [formulaMode, setFormulaMode] = useState('irc'); // 'irc' (4.40) or 'prompt' (8.80 alternative)
  const [isSpeaking, setIsSpeaking] = useState(false);
  const [audioMuted, setAudioMuted] = useState(false);
  const [activeHandle, setActiveHandle] = useState(null); // 'n1' or 'n2' or null for canvas drag

  // Dimensions
  const h1 = 1.2; // Driver eye height (m)
  const h2 = 0.15; // Object height (m)

  // Simulation play/pause state for moving vehicle
  const [isPlaying, setIsPlaying] = useState(true);
  const [carProgress, setCarProgress] = useState(0.1); // 0.0 to 1.0 representing path position

  // Refs for Canvas Elements
  const mainCanvasRef = useRef(null);
  const mathCanvasRef = useRef(null);
  const audioCtxRef = useRef(null);

  // Initializing Audio Context
  const getAudioContext = () => {
    if (!audioCtxRef.current) {
      audioCtxRef.current = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtxRef.current.state === 'suspended') {
      audioCtxRef.current.resume();
    }
    return audioCtxRef.current;
  };

  // Soft Interaction Tone (440Hz pulse) for slider adjustments
  const playInteractionTone = () => {
    if (audioMuted) return;
    try {
      const ctx = getAudioContext();
      const osc = ctx.createOscillator();
      const gainNode = ctx.createGain();

      osc.type = 'sine';
      osc.frequency.value = 440;
      
      gainNode.gain.setValueAtTime(0.015, ctx.currentTime);
      gainNode.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.12);

      osc.connect(gainNode);
      gainNode.connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + 0.12);
    } catch (e) {
      console.warn("Audio Context failed:", e);
    }
  };

  // High calculation tone (ping sweep) on major recalculation triggers
  const playCalculationTone = () => {
    if (audioMuted) return;
    try {
      const ctx = getAudioContext();
      const osc = ctx.createOscillator();
      const gainNode = ctx.createGain();

      osc.type = 'triangle';
      osc.frequency.setValueAtTime(400, ctx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(820, ctx.currentTime + 0.2);

      gainNode.gain.setValueAtTime(0.03, ctx.currentTime);
      gainNode.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.22);

      osc.connect(gainNode);
      gainNode.connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + 0.22);
    } catch (e) {
      console.warn("Audio Context failed:", e);
    }
  };

  // Calculate Algebraic Difference of Grades
  const n1_decimal = n1 / 100;
  const n2_decimal = n2 / 100;
  const N = Math.abs(n1_decimal - n2_decimal);

  // Stopping Sight Distance Calculation
  const SSD = (0.278 * V * t) + (Math.pow(V, 2) / (254 * f));

  // Determine Denominator for Formula Based on Selected Mode
  // Standard IRC formula uses (sqrt(2h1) + sqrt(2h2))^2 which is approx 4.40
  // User Prompt specifies 2 * (sqrt(2h1) + sqrt(2h2))^2 which would be approx 8.80
  const denomIRC = Math.pow(Math.sqrt(2 * h1) + Math.sqrt(2 * h2), 2); // ~4.397
  const denomPrompt = 2 * Math.pow(Math.sqrt(2 * h1) + Math.sqrt(2 * h2), 2); // ~8.795
  const denominator = formulaMode === 'irc' ? denomIRC : denomPrompt;

  // Summit Curve Length Calculation (L > SSD scenario)
  const L_gt = (N * Math.pow(SSD, 2)) / denominator;

  // Let's also calculate L < SSD to show comparisons & engineering integrity
  const L_lt = 2 * SSD - (denominator / N);

  // Choose the mathematically consistent length
  const L = L_gt > SSD ? L_gt : L_lt;
  const isL_greaterThan_SSD = L > SSD;

  // Truncated/rounded values for presentation
  const N_pct_string = (N * 100).toFixed(1);
  const L_display = L.toFixed(2);
  const SSD_display = SSD.toFixed(2);

  // Track parameters changing to play sound feedbacks
  useEffect(() => {
    playCalculationTone();
  }, [V, n1, n2, f, t, formulaMode]);

  // Main canvas animation loop
  useEffect(() => {
    let animationFrameId;
    let lastTime = 0;

    const render = (time) => {
      if (isPlaying) {
        setCarProgress((prev) => {
          const next = prev + 0.003;
          return next > 1.0 ? 0.0 : next;
        });
      }
      drawMainCanvas();
      drawMathCanvas();
      animationFrameId = requestAnimationFrame(render);
    };

    animationFrameId = requestAnimationFrame(render);
    return () => cancelAnimationFrame(animationFrameId);
  }, [isPlaying, carProgress, V, n1, n2, f, t, formulaMode, L, SSD]);

  const drawMainCanvas = () => {
    const canvas = mainCanvasRef.current;
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    const width = canvas.width;
    const height = canvas.height;

    // Clear and set background
    ctx.clearRect(0, 0, width, height);
    ctx.fillStyle = '#0f131c';
    ctx.fillRect(0, 0, width, height);

    // Draw tech background grid
    ctx.strokeStyle = 'rgba(6, 182, 212, 0.06)';
    ctx.lineWidth = 1;
    const gridSize = 40;
    for (let x = 0; x < width; x += gridSize) {
      ctx.beginPath();
      ctx.moveTo(x, 0);
      ctx.lineTo(x, height);
      ctx.stroke();
    }
    for (let y = 0; y < height; y += gridSize) {
      ctx.beginPath();
      ctx.moveTo(0, y);
      ctx.lineTo(width, y);
      ctx.stroke();
    }

    // Mathematical coordinate mapping to pixels
    // Let's map X from -0.3L to 1.3L to pixels [80, width - 80]
    // Let's compute vertical profile coordinates
    const startX = -0.3 * L;
    const endX = 1.3 * L;
    const rangeX = endX - startX;

    const getPixelCoords = (mathX) => {
      const px = 80 + ((mathX - startX) / rangeX) * (width - 160);
      
      // Calculate mathY
      let mathY = 0;
      if (mathX <= 0) {
        // Entering Tangent
        mathY = n1_decimal * mathX;
      } else if (mathX <= L) {
        // Parabolic summit curve
        mathY = n1_decimal * mathX - (N / (2 * L)) * Math.pow(mathX, 2);
      } else {
        // Exiting Tangent
        const y_evc = n1_decimal * L - (N / (2 * L)) * Math.pow(L, 2);
        mathY = y_evc + n2_decimal * (mathX - L);
      }

      // Map MathY to pixels (let's vertically center and auto-scale dynamically)
      // Since gradients are small percentages, amplify visually for beautiful presentation
      const verticalAmplify = 4.5;
      const py = height / 2 - (mathY * verticalAmplify * (600 / L));
      return { x: px, y: py, slope: mathX <= 0 ? n1_decimal : (mathX <= L ? (n1_decimal - (N / L) * mathX) : n2_decimal) };
    };

    // Draw the grade guidelines (dashed tangents intersecting at PVI)
    const bvcPixel = getPixelCoords(0);
    const evcPixel = getPixelCoords(L);
    const pviX = L / 2;
    const pviY_math = n1_decimal * pviX;
    const pviPixel = {
      x: 80 + ((pviX - startX) / rangeX) * (width - 160),
      y: height / 2 - (pviY_math * 4.5 * (600 / L))
    };

    ctx.setLineDash([4, 6]);
    ctx.strokeStyle = 'rgba(239, 68, 68, 0.4)'; // Red for tangent guides
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(getPixelCoords(startX).x, getPixelCoords(startX).y);
    ctx.lineTo(pviPixel.x, pviPixel.y);
    ctx.lineTo(getPixelCoords(endX).x, getPixelCoords(endX).y);
    ctx.stroke();
    ctx.setLineDash([]);

    // Draw Road Surface Curve
    ctx.beginPath();
    const steps = 150;
    for (let i = 0; i <= steps; i++) {
      const currMathX = startX + (i / steps) * rangeX;
      const pixel = getPixelCoords(currMathX);
      if (i === 0) {
        ctx.moveTo(pixel.x, pixel.y);
      } else {
        ctx.lineTo(pixel.x, pixel.y);
      }
    }
    ctx.strokeStyle = '#06b6d4'; // Cyan neon road
    ctx.lineWidth = 6;
    ctx.shadowColor = 'rgba(6, 182, 212, 0.5)';
    ctx.shadowBlur = 12;
    ctx.stroke();
    ctx.shadowBlur = 0; // Reset glow

    // Draw asphalt underlay filling
    ctx.fillStyle = 'rgba(15, 23, 42, 0.85)';
    ctx.beginPath();
    ctx.moveTo(getPixelCoords(startX).x, height);
    for (let i = 0; i <= steps; i++) {
      const currMathX = startX + (i / steps) * rangeX;
      const pixel = getPixelCoords(currMathX);
      ctx.lineTo(pixel.x, pixel.y);
    }
    ctx.lineTo(getPixelCoords(endX).x, height);
    ctx.closePath();
    ctx.fill();

    // Draw Road Markings (Yellow center dashed lines)
    ctx.setLineDash([8, 10]);
    ctx.strokeStyle = '#eab308';
    ctx.lineWidth = 2;
    ctx.beginPath();
    for (let i = 0; i <= steps; i++) {
      const currMathX = startX + (i / steps) * rangeX;
      const pixel = getPixelCoords(currMathX);
      if (i === 0) ctx.moveTo(pixel.x, pixel.y - 1);
      else ctx.lineTo(pixel.x, pixel.y - 1);
    }
    ctx.stroke();
    ctx.setLineDash([]);

    // Highlight special stations: BVC, PVI, EVC
    const drawStationPin = (pt, label, subLabel, color) => {
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.arc(pt.x, pt.y, 6, 0, 2 * Math.PI);
      ctx.fill();
      ctx.strokeStyle = '#0f131c';
      ctx.lineWidth = 2;
      ctx.stroke();

      ctx.fillStyle = '#94a3b8';
      ctx.font = '10px JetBrains Mono';
      ctx.textAlign = 'center';
      ctx.fillText(label, pt.x, pt.y - 14);
      ctx.fillStyle = '#cbd5e1';
      ctx.fillText(subLabel, pt.x, pt.y - 25);
    };

    drawStationPin(bvcPixel, "BVC", `x=0.00m`, '#10b981');
    drawStationPin(pviPixel, "PVI", `VPI Intersect`, '#ef4444');
    drawStationPin(evcPixel, "EVC", `L=${L_display}m`, '#10b981');

    // Interactive slope drag handle coordinates (ends of tangents)
    const handleLeft = getPixelCoords(startX);
    const handleRight = getPixelCoords(endX);

    // Render interactive pulse ring around controls
    const renderInteractiveHandle = (pt, isActive, labelText) => {
      ctx.strokeStyle = isActive ? '#ff9d00' : 'rgba(255, 157, 0, 0.6)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(pt.x, pt.y, isActive ? 16 : 12, 0, 2 * Math.PI);
      ctx.stroke();

      ctx.fillStyle = 'rgba(255, 157, 0, 0.2)';
      ctx.beginPath();
      ctx.arc(pt.x, pt.y, isActive ? 16 : 12, 0, 2 * Math.PI);
      ctx.fill();

      ctx.fillStyle = '#ff9d00';
      ctx.beginPath();
      ctx.arc(pt.x, pt.y, 5, 0, 2 * Math.PI);
      ctx.fill();

      // Label
      ctx.fillStyle = '#ff9d00';
      ctx.font = 'bold 11px Inter';
      ctx.textAlign = pt.x < width / 2 ? 'left' : 'right';
      ctx.fillText(labelText, pt.x < width / 2 ? pt.x + 20 : pt.x - 20, pt.y + 4);
    };

    renderInteractiveHandle(handleLeft, activeHandle === 'n1', `Drag n1: +${n1.toFixed(1)}%`);
    renderInteractiveHandle(handleRight, activeHandle === 'n2', `Drag n2: ${n2.toFixed(1)}%`);

    // Vehicle animation position mapping
    const carMathX = startX + carProgress * rangeX;
    const carPos = getPixelCoords(carMathX);

    // Calculate vehicle orientation angle
    const angle = Math.atan(carPos.slope);

    // Draw vehicle
    ctx.save();
    ctx.translate(carPos.x, carPos.y);
    ctx.rotate(angle);

    // Draw glowing sleek vehicle silhouette
    ctx.fillStyle = '#ff007f'; // Neon magenta car body
    ctx.shadowColor = '#ff007f';
    ctx.shadowBlur = 10;
    
    // Draw sports car design
    ctx.beginPath();
    ctx.moveTo(-18, -2);
    ctx.lineTo(-15, -8);
    ctx.lineTo(-6, -9);
    ctx.lineTo(4, -9);
    ctx.lineTo(10, -5);
    ctx.lineTo(18, -3);
    ctx.lineTo(20, 0);
    ctx.lineTo(-18, 0);
    ctx.closePath();
    ctx.fill();
    ctx.shadowBlur = 0;

    // Car Wheels
    ctx.fillStyle = '#1e293b';
    ctx.strokeStyle = '#06b6d4';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.arc(-10, 1, 4, 0, 2 * Math.PI);
    ctx.arc(10, 1, 4, 0, 2 * Math.PI);
    ctx.fill();
    ctx.stroke();

    // Headlight visual beam projection
    ctx.fillStyle = 'rgba(253, 224, 71, 0.15)';
    ctx.beginPath();
    ctx.moveTo(18, -2);
    ctx.lineTo(80, -25);
    ctx.lineTo(80, 15);
    ctx.closePath();
    ctx.fill();

    ctx.restore();

    // Draw Driver's Eye Line Offset (h1 = 1.2m)
    const eyeOffsetMath = h1;
    const eyePixelOffset = eyeOffsetMath * 4.5 * (600 / L);
    const driverEyePt = {
      x: carPos.x - Math.sin(angle) * eyePixelOffset,
      y: carPos.y - Math.cos(angle) * eyePixelOffset
    };

    // Draw Driver Eye Icon
    ctx.fillStyle = '#f59e0b';
    ctx.beginPath();
    ctx.arc(driverEyePt.x, driverEyePt.y, 4, 0, 2 * Math.PI);
    ctx.fill();
    ctx.fillStyle = '#ffffff';
    ctx.font = '9px JetBrains Mono';
    ctx.fillText("h1=1.2m", driverEyePt.x, driverEyePt.y - 8);

    // Target object placement at exact SSD distance ahead
    const targetMathX = carMathX + SSD;
    const targetPosOnRoad = getPixelCoords(targetMathX);

    // Target vertical height (h2 = 0.15m)
    const objectOffsetMath = h2;
    const objectPixelOffset = objectOffsetMath * 4.5 * (600 / L);
    const targetSlopeAngle = Math.atan(targetPosOnRoad.slope);
    const targetPt = {
      x: targetPosOnRoad.x - Math.sin(targetSlopeAngle) * objectPixelOffset,
      y: targetPosOnRoad.y - Math.cos(targetSlopeAngle) * objectPixelOffset
    };

    // Draw Target Object
    ctx.fillStyle = '#ef4444'; // Red target
    ctx.beginPath();
    ctx.rect(targetPt.x - 3, targetPt.y - 4, 6, 8);
    ctx.fill();
    ctx.fillStyle = '#ffffff';
    ctx.font = '9px JetBrains Mono';
    ctx.fillText("h2=0.15m", targetPt.x, targetPt.y - 8);

    // We sample points between driverEye and Target to determine if any point hits road surface
    let pathBlocked = false;
    const samplingPointsCount = 25;
    ctx.beginPath();
    ctx.moveTo(driverEyePt.x, driverEyePt.y);

    for (let j = 1; j <= samplingPointsCount; j++) {
      const ratio = j / samplingPointsCount;
      const sampleX = driverEyePt.x + ratio * (targetPt.x - driverEyePt.x);
      const sampleY = driverEyePt.y + ratio * (targetPt.y - driverEyePt.y);

      // Convert back sampleX to math coordinates
      const sampleMathX = startX + ((sampleX - 80) / (width - 160)) * rangeX;
      const roadReferencePixel = getPixelCoords(sampleMathX);

      // In Canvas Coordinates, lower pixel values represent HIGHER elevation. 
      // If sampleY > roadReferencePixel.y, it has sunk below road profile, meaning sight is blocked!
      if (sampleY > roadReferencePixel.y && sampleMathX > carMathX && sampleMathX < targetMathX) {
        pathBlocked = true;
      }
    }

    // Paint Sight Distance Vector Line
    ctx.setLineDash([2, 2]);
    ctx.strokeStyle = pathBlocked ? '#ef4444' : '#10b981'; // Red blocked vs Green Clear
    ctx.lineWidth = 2.5;
    ctx.shadowColor = pathBlocked ? 'rgba(239, 68, 68, 0.8)' : 'rgba(16, 185, 129, 0.8)';
    ctx.shadowBlur = 8;
    ctx.beginPath();
    ctx.moveTo(driverEyePt.x, driverEyePt.y);
    ctx.lineTo(targetPt.x, targetPt.y);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.shadowBlur = 0;

    // Line connecting target block back to ground
    ctx.strokeStyle = 'rgba(255,255,255,0.2)';
    ctx.beginPath();
    ctx.moveTo(targetPt.x, targetPt.y);
    ctx.lineTo(targetPosOnRoad.x, targetPosOnRoad.y);
    ctx.stroke();

    // Print real-time status overlay in the top left
    ctx.fillStyle = 'rgba(15, 23, 42, 0.85)';
    ctx.strokeStyle = 'rgba(255,255,255,0.08)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.roundRect(16, 16, 260, 95, 6);
    ctx.fill();
    ctx.stroke();

    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 11px Inter';
    ctx.textAlign = 'left';
    ctx.fillText("SIGHT-LINE EVALUATOR (LIVE)", 24, 36);

    ctx.fillStyle = '#94a3b8';
    ctx.font = '10px JetBrains Mono';
    ctx.fillText(`Required Sight Distance (SSD): ${SSD_display}m`, 24, 54);
    ctx.fillText(`Current Curve Length (L):     ${L_display}m`, 24, 70);
    
    // Status flag
    if (pathBlocked) {
      ctx.fillStyle = '#ef4444';
      ctx.font = 'bold 10px JetBrains Mono';
      ctx.fillText("STATUS: SIGHT LINE OBSTRUCTED ❌", 24, 88);
    } else {
      ctx.fillStyle = '#10b981';
      ctx.font = 'bold 10px JetBrains Mono';
      ctx.fillText("STATUS: SIGHT LINE CLEAR ✅", 24, 88);
    }
  };

  const drawMathCanvas = () => {
    const canvas = mathCanvasRef.current;
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    const width = canvas.width;
    const height = canvas.height;

    ctx.clearRect(0, 0, width, height);
    ctx.fillStyle = '#111520';
    ctx.fillRect(0, 0, width, height);

    // Drawing Coordinate Axes
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.15)';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    // X-axis
    ctx.moveTo(15, height - 30);
    ctx.lineTo(width - 15, height - 30);
    // Y-axis
    ctx.moveTo(35, 15);
    ctx.lineTo(35, height - 15);
    ctx.stroke();

    // Plotting y = a*x^2 + b*x relative values
    // Vertex is at x = L/2, y = (N * L) / 8
    ctx.strokeStyle = '#ff9d00';
    ctx.lineWidth = 2.5;
    ctx.beginPath();

    const graphW = width - 60;
    const graphH = height - 60;
    const graphSteps = 100;

    for (let i = 0; i <= graphSteps; i++) {
      const ratio = i / graphSteps;
      const xVal = ratio * L;
      // Parabolic offset relative to straight tangent line
      // y = - (N / (2*L)) * x^2 + n1_decimal * x;
      const yVal = n1_decimal * xVal - (N / (2 * L)) * Math.pow(xVal, 2);

      // Coordinate scaling fit
      const plotX = 35 + ratio * graphW;
      const plotY = (height - 30) - (yVal * (graphH / (0.1 * L)));

      if (i === 0) ctx.moveTo(plotX, plotY);
      else ctx.lineTo(plotX, plotY);
    }
    ctx.stroke();

    // Title label
    ctx.fillStyle = '#e2e8f0';
    ctx.font = '10px Inter';
    ctx.textAlign = 'center';
    ctx.fillText("Parabolic Profile Plotter", width / 2, 20);

    // Formula label
    ctx.fillStyle = '#818cf8';
    ctx.font = '9px JetBrains Mono';
    ctx.fillText(`y = -(${ (N / (2 * L)).toFixed(6) })x² + ${(n1_decimal).toFixed(3)}x`, width / 2, height - 8);
  };

  const speakState = () => {
    if (typeof window === 'undefined' || !window.speechSynthesis) {
      alert("Speech synthesis is not supported in this browser.");
      return;
    }

    if (isSpeaking) {
      window.speechSynthesis.cancel();
      setIsSpeaking(false);
      return;
    }

    const reportText = `The algebraic difference in grades is ${N_pct_string} percent. Since the design speed is ${V} kilometers per hour, the required Stopping Sight Distance is ${SSD_display} meters. Therefore, the minimum summit vertical curve length required is ${L_display} meters.`;
    
    const utterance = new SpeechSynthesisUtterance(reportText);
    utterance.onend = () => {
      setIsSpeaking(false);
    };
    utterance.onerror = () => {
      setIsSpeaking(false);
    };

    setIsSpeaking(true);
    window.speechSynthesis.speak(utterance);
  };

  // Convert coordinate interactions
  const handleCanvasMouseDown = (e) => {
    const canvas = mainCanvasRef.current;
    if (!canvas) return;
    const rect = canvas.getBoundingClientRect();
    const clickX = e.clientX - rect.left;
    const clickY = e.clientY - rect.top;

    const startX = -0.3 * L;
    const endX = 1.3 * L;
    const rangeX = endX - startX;
    const width = canvas.width;
    const height = canvas.height;

    const getPixelCoords = (mathX) => {
      const px = 80 + ((mathX - startX) / rangeX) * (width - 160);
      let mathY = 0;
      if (mathX <= 0) mathY = n1_decimal * mathX;
      else if (mathX <= L) mathY = n1_decimal * mathX - (N / (2 * L)) * Math.pow(mathX, 2);
      else {
        const y_evc = n1_decimal * L - (N / (2 * L)) * Math.pow(L, 2);
        mathY = y_evc + n2_decimal * (mathX - L);
      }
      const verticalAmplify = 4.5;
      const py = height / 2 - (mathY * verticalAmplify * (600 / L));
      return { x: px, y: py };
    };

    const handleLeft = getPixelCoords(startX);
    const handleRight = getPixelCoords(endX);

    // Check click hit distance
    const distLeft = Math.hypot(clickX - handleLeft.x, clickY - handleLeft.y);
    const distRight = Math.hypot(clickX - handleRight.x, clickY - handleRight.y);

    if (distLeft < 22) {
      setActiveHandle('n1');
      playInteractionTone();
    } else if (distRight < 22) {
      setActiveHandle('n2');
      playInteractionTone();
    }
  };

  const handleCanvasMouseMove = (e) => {
    if (!activeHandle) return;
    const canvas = mainCanvasRef.current;
    if (!canvas) return;
    const rect = canvas.getBoundingClientRect();
    const currentY = e.clientY - rect.top;
    const height = canvas.height;

    // Derive relative vertical position to scale slopes
    // Dragging higher (low pixel value) increases grade slope, lower reduces it
    const centerOffset = height / 2 - currentY;
    const scaledSlope = (centerOffset / 20).toFixed(1);
    const slopeVal = Math.max(-10.0, Math.min(10.0, parseFloat(scaledSlope)));

    if (activeHandle === 'n1') {
      // Must keep positive ascending gradient
      setN1(Math.max(1.0, slopeVal));
    } else if (activeHandle === 'n2') {
      // Must keep negative descending gradient
      setN2(Math.min(-1.0, slopeVal));
    }
    playInteractionTone();
  };

  const handleCanvasMouseUp = () => {
    setActiveHandle(null);
  };

  return (
    <div className="min-h-screen p-4 md:p-8 flex flex-col justify-between max-w-7xl mx-auto">
      {/* Simulation Header */}
      <header className="mb-6 border-b border-white/10 pb-4 flex flex-col md:flex-row md:items-center md:justify-between gap-4">
        <div>
          <div className="flex items-center gap-2">
            <span className="h-3.5 w-3.5 rounded-full bg-cyan-500 animate-pulse neon-border-cyan"></span>
            <h1 className="text-xl md:text-2xl font-bold tracking-tight text-white uppercase font-mono-custom">
              Vertical Summit Curve Designer
            </h1>
          </div>
          <p className="text-xs md:text-sm text-slate-400 mt-1">
            Transportation Engineering & Geometric Highway Design Interactive Module
          </p>
        </div>

        {/* Audio and TTS Controls */}
        <div className="flex items-center gap-3">
          <button
            onClick={() => setAudioMuted(!audioMuted)}
            className={`px-3 py-1.5 rounded-lg text-xs font-medium flex items-center gap-2 transition-all duration-300 ${
              audioMuted ? 'bg-red-500/20 text-red-400 border border-red-500/30' : 'bg-slate-800 text-slate-300 border border-slate-700'
            }`}
          >
            <i className={`fas ${audioMuted ? 'fa-volume-mute' : 'fa-volume-up'}`}></i>
            {audioMuted ? "Audio Muted" : "Audio Active"}
          </button>
          <button
            onClick={speakState}
            className={`px-4 py-1.5 rounded-lg text-xs font-semibold flex items-center gap-2 transition-all duration-300 ${
              isSpeaking ? 'bg-cyan-500 text-black shadow-lg shadow-cyan-500/30' : 'bg-cyan-500/20 text-cyan-400 hover:bg-cyan-500 hover:text-black'
            }`}
          >
            <i className="fas fa-headset text-sm"></i>
            {isSpeaking ? "Narrating..." : "Voice Narrative"}
          </button>
        </div>
      </header>

      {/* Main Interactive Grid */}
      <main className="grid grid-cols-1 lg:grid-cols-3 gap-6 items-start mb-6">
        
        {/* Left column: High-Fidelity Main Canvas Sandbox */}
        <section className="lg:col-span-2 flex flex-col gap-4">
          <div className="glass-panel p-4 rounded-xl flex flex-col relative overflow-hidden">
            <div className="flex items-center justify-between mb-2">
              <span className="text-xs font-semibold text-cyan-400 uppercase tracking-widest font-mono-custom">
                Interactive Profile Simulator
              </span>
              <div className="flex items-center gap-4">
                <span className="text-[10px] text-slate-400">
                  💡 Hint: Drag handles on road endpoints to adjust slopes directly!
                </span>
                <button
                  onClick={() => setIsPlaying(!isPlaying)}
                  className="px-2.5 py-1 rounded bg-cyan-500/10 text-cyan-400 border border-cyan-500/20 hover:bg-cyan-500 hover:text-black text-xs font-bold transition-all"
                >
                  {isPlaying ? "Pause Car" : "Play Car"}
                </button>
              </div>
            </div>

            {/* Simulated Road viewport */}
            <div className="w-full relative bg-slate-950 rounded-lg overflow-hidden border border-white/5">
              <canvas
                ref={mainCanvasRef}
                width={800}
                height={400}
                onMouseDown={handleCanvasMouseDown}
                onMouseMove={handleCanvasMouseMove}
                onMouseUp={handleCanvasMouseUp}
                onMouseLeave={handleCanvasMouseUp}
                onTouchStart={(e) => {
                  const touch = e.touches[0];
                  handleCanvasMouseDown({
                    clientX: touch.clientX,
                    clientY: touch.clientY
                  });
                }}
                onTouchMove={(e) => {
                  const touch = e.touches[0];
                  handleCanvasMouseMove({
                    clientX: touch.clientX,
                    clientY: touch.clientY
                  });
                }}
                onTouchEnd={handleCanvasMouseUp}
                className="w-full h-auto max-h-[400px] cursor-pointer block"
              />
            </div>

            {/* Color Legend indicator bar */}
            <div className="grid grid-cols-2 md:grid-cols-4 gap-2 text-center text-[10px] mt-3 border-t border-white/5 pt-2 text-slate-400">
              <div className="flex items-center gap-1.5 justify-center">
                <span className="w-2.5 h-2.5 rounded-full bg-cyan-500 inline-block"></span>
                <span>Parabolic Curve Surface</span>
              </div>
              <div className="flex items-center gap-1.5 justify-center">
                <span className="w-2.5 h-2.5 rounded bg-amber-500 inline-block"></span>
                <span>Active Tangent Handles</span>
              </div>
              <div className="flex items-center gap-1.5 justify-center">
                <span className="w-2.5 h-2.5 rounded bg-green-500 inline-block"></span>
                <span>Clear Sight Vector</span>
              </div>
              <div className="flex items-center gap-1.5 justify-center">
                <span className="w-2.5 h-2.5 rounded bg-red-500 inline-block"></span>
                <span>Obstructed Sight Vector</span>
              </div>
            </div>
          </div>
        </section>

        {/* Right column: Simulation Controllers & Live Outputs */}
        <section className="flex flex-col gap-6">
          {/* Controls Glassmorphism Card */}
          <div className="glass-panel p-5 rounded-xl flex flex-col gap-4">
            <h2 className="text-sm font-semibold tracking-wider text-slate-300 uppercase font-mono-custom border-b border-white/5 pb-2">
              Parameters Controller
            </h2>

            {/* SPEED SLIDER */}
            <div className="flex flex-col gap-1">
              <div className="flex items-center justify-between text-xs text-slate-300">
                <span>Design Speed (V)</span>
                <span className="font-bold text-cyan-400 font-mono-custom">{V} Kmph</span>
              </div>
              <input
                type="range"
                min="60"
                max="120"
                step="5"
                value={V}
                onChange={(e) => {
                  setV(parseInt(e.target.value));
                  playInteractionTone();
                }}
                className="w-full h-1.5 bg-slate-800 rounded-lg appearance-none cursor-pointer custom-slider outline-none"
              />
              <div className="flex justify-between text-[9px] text-slate-500 px-1">
                <span>60 Kmph</span>
                <span>90 Kmph</span>
                <span>120 Kmph</span>
              </div>
            </div>

            {/* GRADIENT N1 SLIDER */}
            <div className="flex flex-col gap-1">
              <div className="flex items-center justify-between text-xs text-slate-300">
                <span>Entering Grade (n₁)</span>
                <span className="font-bold text-emerald-400 font-mono-custom">+{n1.toFixed(1)}%</span>
              </div>
              <input
                type="range"
                min="1.0"
                max="10.0"
                step="0.5"
                value={n1}
                onChange={(e) => {
                  setN1(parseFloat(e.target.value));
                  playInteractionTone();
                }}
                className="w-full h-1.5 bg-slate-800 rounded-lg appearance-none cursor-pointer custom-slider outline-none"
              />
              <div className="flex justify-between text-[9px] text-slate-500 px-1">
                <span>+1.0%</span>
                <span>+5.0%</span>
                <span>+10.0%</span>
              </div>
            </div>

            {/* GRADIENT N2 SLIDER */}
            <div className="flex flex-col gap-1">
              <div className="flex items-center justify-between text-xs text-slate-300">
                <span>Exiting Grade (n₂)</span>
                <span className="font-bold text-rose-400 font-mono-custom">{n2.toFixed(1)}%</span>
              </div>
              <input
                type="range"
                min="-10.0"
                max="-1.0"
                step="0.5"
                value={n2}
                onChange={(e) => {
                  setN2(parseFloat(e.target.value));
                  playInteractionTone();
                }}
                className="w-full h-1.5 bg-slate-800 rounded-lg appearance-none cursor-pointer custom-slider outline-none"
              />
              <div className="flex justify-between text-[9px] text-slate-500 px-1">
                <span>-1.0%</span>
                <span>-5.0%</span>
                <span>-10.0%</span>
              </div>
            </div>

            {/* FRICTION FACTOR SLIDER */}
            <div className="flex flex-col gap-1">
              <div className="flex items-center justify-between text-xs text-slate-300">
                <span>Friction Factor (f)</span>
                <span className="font-bold text-indigo-400 font-mono-custom">{f}</span>
              </div>
              <input
                type="range"
                min="0.30"
                max="0.45"
                step="0.01"
                value={f}
                onChange={(e) => {
                  setF(parseFloat(e.target.value));
                  playInteractionTone();
                }}
                className="w-full h-1.5 bg-slate-800 rounded-lg appearance-none cursor-pointer custom-slider outline-none"
              />
              <div className="flex justify-between text-[9px] text-slate-500 px-1">
                <span>0.30</span>
                <span>0.38</span>
                <span>0.45</span>
              </div>
            </div>

            {/* PI-TIME SLIDER */}
            <div className="flex flex-col gap-1">
              <div className="flex items-center justify-between text-xs text-slate-300">
                <span>Reaction Time (t)</span>
                <span className="font-bold text-indigo-400 font-mono-custom">{t} s</span>
              </div>
              <input
                type="range"
                min="1.5"
                max="3.0"
                step="0.1"
                value={t}
                onChange={(e) => {
                  setT(parseFloat(e.target.value));
                  playInteractionTone();
                }}
                className="w-full h-1.5 bg-slate-800 rounded-lg appearance-none cursor-pointer custom-slider outline-none"
              />
              <div className="flex justify-between text-[9px] text-slate-500 px-1">
                <span>1.5s (Aggressive)</span>
                <span>2.5s (IRC Std)</span>
                <span>3.0s (Cautious)</span>
              </div>
            </div>

            {/* DESIGN STANDARD / FORMULA TOGGLE */}
            <div className="flex flex-col gap-2 pt-2 border-t border-white/5">
              <label className="text-[11px] font-semibold tracking-wider text-slate-400 uppercase font-mono-custom">
                Methodology & Constants
              </label>
              <div className="grid grid-cols-2 gap-2">
                <button
                  onClick={() => setFormulaMode('irc')}
                  className={`px-3 py-1.5 rounded text-xs font-semibold border transition-all ${
                    formulaMode === 'irc'
                      ? 'bg-cyan-500/20 text-cyan-400 border-cyan-500'
                      : 'bg-transparent text-slate-400 border-white/10 hover:border-white/20'
                  }`}
                >
                  IRC Std (D = 4.40)
                </button>
                <button
                  onClick={() => setFormulaMode('prompt')}
                  className={`px-3 py-1.5 rounded text-xs font-semibold border transition-all ${
                    formulaMode === 'prompt'
                      ? 'bg-orange-500/20 text-orange-400 border-orange-500'
                      : 'bg-transparent text-slate-400 border-white/10 hover:border-white/20'
                  }`}
                >
                  Textbook (D = 8.80)
                </button>
              </div>
            </div>
          </div>

          {/* Mini mathematical curve card */}
          <div className="glass-panel p-5 rounded-xl flex flex-col gap-4">
            <h2 className="text-sm font-semibold tracking-wider text-slate-300 uppercase font-mono-custom border-b border-white/5 pb-2">
              Curve Profile Graph
            </h2>
            <div className="w-full bg-slate-950 rounded-lg overflow-hidden border border-white/5">
              <canvas
                ref={mathCanvasRef}
                width={300}
                height={160}
                className="w-full h-auto block"
              />
            </div>
          </div>
        </section>
      </main>

      {}
      {/* Real-time Dynamic Equation & Readouts Section */}
      <footer className="glass-panel p-6 rounded-xl flex flex-col gap-6">
        <div>
          <h2 className="text-sm font-bold tracking-widest text-cyan-400 uppercase font-mono-custom mb-3">
            Real-Time Design Computation
          </h2>
          <div className="grid grid-cols-1 md:grid-cols-4 gap-4 text-center">
            <div className="bg-slate-900/50 p-3 rounded-lg border border-white/5">
              <span className="text-[10px] uppercase text-slate-400 font-mono-custom">Change in Grade (N)</span>
              <p className="text-lg font-bold text-white mt-1 font-mono-custom">{(N * 100).toFixed(1)}%</p>
              <span className="text-[9px] text-slate-500 font-mono-custom">n₁ - n₂</span>
            </div>
            <div className="bg-slate-900/50 p-3 rounded-lg border border-white/5">
              <span className="text-[10px] uppercase text-slate-400 font-mono-custom">Stopping Sight Dist (SSD)</span>
              <p className="text-lg font-bold text-emerald-400 mt-1 font-mono-custom">{SSD_display} m</p>
              <span className="text-[9px] text-slate-500 font-mono-custom">V-reaction + braking</span>
            </div>
            <div className="bg-slate-900/50 p-3 rounded-lg border border-white/5">
              <span className="text-[10px] uppercase text-slate-400 font-mono-custom">Curve Length (L)</span>
              <p className="text-lg font-bold text-cyan-400 mt-1 font-mono-custom">{L_display} m</p>
              <span className="text-[9px] text-slate-500 font-mono-custom">{isL_greaterThan_SSD ? "L > SSD (Governs)" : "L ≤ SSD"}</span>
            </div>
            <div className="bg-slate-900/50 p-3 rounded-lg border border-white/5">
              <span className="text-[10px] uppercase text-slate-400 font-mono-custom">Evaluation Status</span>
              <p className={`text-sm font-bold mt-2 font-mono-custom ${isL_greaterThan_SSD ? 'text-cyan-400' : 'text-amber-400'}`}>
                {isL_greaterThan_SSD ? "L > SSD Valid ✅" : "L < SSD (Refit)"}
              </p>
            </div>
          </div>
        </div>

        {/* LaTeX Dynamic Visualizations */}
        <div className="border-t border-white/5 pt-4">
          <label className="text-xs font-semibold text-slate-300 uppercase tracking-wider block mb-3">
            Mathematical Equations Proof
          </label>
          <div className="space-y-4 text-xs md:text-sm text-slate-300 font-mono-custom">
            
            {/* Step 1: Algebraic difference */}
            <div className="bg-slate-950/40 p-3 rounded border border-white/5 flex flex-col md:flex-row md:items-center justify-between gap-2">
              <span className="text-slate-400">1. Algebraic difference in grades:</span>
              <div className="text-white">
                N = |g₁ - g₂| = |{n1_decimal.toFixed(3)} - ({n2_decimal.toFixed(3)})| = <span className="text-cyan-400 font-bold">{N.toFixed(4)}</span>
              </div>
            </div>

            {/* Step 2: SSD derivation */}
            <div className="bg-slate-950/40 p-3 rounded border border-white/5 flex flex-col md:flex-row md:items-center justify-between gap-2">
              <span className="text-slate-400">2. Stopping Sight Distance (SSD):</span>
              <div className="text-white text-right">
                SSD = (0.278 × V × t) + (V² / (254 × f)) <br />
                SSD = (0.278 × {V} × {t}) + ({Math.pow(V, 2)} / (254 × {f})) = <span className="text-emerald-400 font-bold">{SSD_display}m</span>
              </div>
            </div>

            {/* Step 3: Vertical curve calculation */}
            <div className="bg-slate-950/40 p-3 rounded border border-white/5 flex flex-col md:flex-row md:items-center justify-between gap-2">
              <span className="text-slate-400">3. Summit Curve Length (L) where L &gt; SSD:</span>
              <div className="text-white text-right">
                {formulaMode === 'irc' ? (
                  <span>L = (N × SSD²) / (√2h₁ + √2h₂)²</span>
                ) : (
                  <span>L = (N × SSD²) / [2 × (√2h₁ + √2h₂)²]</span>
                )}
                <br />
                L = ({N.toFixed(4)} × {SSD_display}²) / {denominator.toFixed(3)} = <span className="text-cyan-400 font-bold">{L_display}m</span>
              </div>
            </div>

          </div>
        </div>
      </footer>
    </div>
  );
}

    if (typeof App !== 'undefined') {
      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(<App />);
    }
  </script>
</body>
</html>
