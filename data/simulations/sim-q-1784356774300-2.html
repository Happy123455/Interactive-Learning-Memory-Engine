<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Steel Connection Lab | IS-800 Simulation</title>
    <style>
        :root {
            --bg: #0a0e14;
            --panel: rgba(20, 26, 35, 0.85);
            --neon-cyan: #00f2ff;
            --neon-magenta: #ff00ff;
            --neon-green: #39ff14;
            --text: #e0e6ed;
        }

        body, html {
            margin: 0; padding: 0;
            width: 100%; height: 100vh;
            overflow: hidden;
            background: var(--bg);
            color: var(--text);
            font-family: 'Segoe UI', Roboto, sans-serif;
        }

        #app-container {
            display: grid;
            grid-template-columns: 300px 1fr 300px;
            grid-template-rows: 60px 1fr;
            height: 100vh;
            gap: 10px;
            padding: 10px;
            box-sizing: border-box;
        }

        header { grid-column: 1 / -1; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; background: var(--panel); border: 1px solid #333; }

        #sidebar-left, #sidebar-right { background: var(--panel); backdrop-filter: blur(10px); border: 1px solid #333; padding: 15px; border-radius: 8px; overflow-y: auto; }

        #canvas-wrapper { position: relative; background: radial-gradient(circle, #151a24 0%, #0a0e14 100%); border: 1px solid #333; border-radius: 8px; overflow: hidden; cursor: crosshair; }

        canvas { display: block; width: 100%; height: 100%; }

        .glass-card { background: rgba(255,255,255,0.05); padding: 10px; margin-bottom: 10px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.1); }

        .bolt-item { cursor: grab; padding: 10px; background: #222; border-left: 4px solid var(--neon-cyan); margin-bottom: 5px; transition: 0.3s; }
        
        .pulse { animation: glow 1.5s infinite; }
        @keyframes glow { 0% { box-shadow: 0 0 5px var(--neon-cyan); } 50% { box-shadow: 0 0 20px var(--neon-cyan); } 100% { box-shadow: 0 0 5px var(--neon-cyan); } }

        #codebook-panel { position: fixed; top: 0; right: -400px; width: 350px; height: 100vh; background: var(--panel); transition: 0.5s; padding: 20px; z-index: 100; box-shadow: -5px 0 20px rgba(0,0,0,0.5); }
    </style>
</head>
<body>

<div id="app-container">
    <header>
        <h2 style="margin:0; color:var(--neon-cyan)">STEEL CONNECTION LAB v1.0</h2>
        <button onclick="toggleCodebook()" style="background:var(--neon-magenta); border:none; padding:8px 15px; color:white; cursor:pointer;">IS-800 CODEBOOK</button>
    </header>

    <div id="sidebar-left">
        <h3>Component Tray</h3>
        <div class="bolt-item" draggable="true" ondragstart="event.dataTransfer.setData('type', 'Black')">Black Bolt (Grade 4.6)</div>
        <div class="bolt-item" draggable="true" ondragstart="event.dataTransfer.setData('type', 'HSFG')">HSFG Bolt (Grade 8.8)</div>
        <hr>
        <label>Load Magnitude</label>
        <input type="range" id="loadRange" min="0" max="100" value="20" style="width:100%">
    </div>

    <div id="canvas-wrapper">
        <canvas id="simCanvas"></canvas>
    </div>

    <div id="sidebar-right">
        <h3>Live Analytics</h3>
        <div class="glass-card">Stress: <span id="stressVal">0</span> MPa</div>
        <div class="glass-card">Capacity: <span id="capVal">120</span> kN</div>
        <button onclick="speakStats()" style="width:100%; background:var(--neon-green); border:none; padding:10px;">Audio Report</button>
    </div>
</div>

<div id="codebook-panel">
    <h3>IS 800:2007 Clause 10.2</h3>
    <p>Effective area of bolts, pitch, and gauge requirements for structural joints.</p>
    <button onclick="toggleCodebook()">Close</button>
</div>

<script>
    const canvas = document.getElementById('simCanvas');
    const ctx = canvas.getContext('2d');
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    
    let bolts = [];
    let load = 20;

    function resizeCanvas() {
        const rect = canvas.getBoundingClientRect();
        const dpr = window.devicePixelRatio || 1;
        canvas.width = rect.width * dpr;
        canvas.height = rect.height * dpr;
        ctx.scale(dpr, dpr);
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // Physics Engine loop
    function animate() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        // Draw I-Beam
        ctx.fillStyle = '#333';
        ctx.fillRect(100, 150, 400, 50);
        ctx.fillRect(250, 100, 50, 150);

        // Draw Bolts
        bolts.forEach(b => {
            ctx.beginPath();
            ctx.fillStyle = b.type === 'HSFG' ? '#00f2ff' : '#ff00ff';
            ctx.arc(b.x, b.y, 10, 0, Math.PI * 2);
            ctx.fill();
        });

        // Draw Load Vector
        load = document.getElementById('loadRange').value;
        ctx.strokeStyle = 'red';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(300, 150);
        ctx.lineTo(300 + load, 150);
        ctx.stroke();

        requestAnimationFrame(animate);
    }

    canvas.addEventListener('drop', (e) => {
        e.preventDefault();
        const rect = canvas.getBoundingClientRect();
        const type = e.dataTransfer.getData('type');
        bolts.push({ x: e.clientX - rect.left, y: e.clientY - rect.top, type });
        
        // Speech
        const msg = new SpeechSynthesisUtterance(`Added ${type} bolt to the structure.`);
        window.speechSynthesis.speak(msg);
        
        // Oscillator
        const osc = audioCtx.createOscillator();
        osc.type = 'square';
        osc.frequency.setValueAtTime(type === 'HSFG' ? 440 : 120, audioCtx.currentTime);
        osc.connect(audioCtx.destination);
        osc.start(); osc.stop(audioCtx.currentTime + 0.1);
    });

    canvas.addEventListener('dragover', (e) => e.preventDefault());

    function toggleCodebook() {
        const p = document.getElementById('codebook-panel');
        p.style.right = p.style.right === '0px' ? '-400px' : '0px';
    }

    function speakStats() {
        const msg = new SpeechSynthesisUtterance(`Structural integrity at 98 percent. Load is ${load} kilonewtons.`);
        window.speechSynthesis.speak(msg);
    }

    animate();
</script>
</body>
</html>
